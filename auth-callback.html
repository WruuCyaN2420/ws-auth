<!DOCTYPE html>
<html>
<head>
  <base target="mainFrame">
  <script>
    if (window.trustedTypes && window.trustedTypes.createPolicy) {
      try {
        window.trustedTypes.createPolicy('default', {
          createHTML: function (s) { return s; },
          createScriptURL: function (s) { return s; },
          createScript: function (s) { return s; }
        });
      } catch (e) {}
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
  <style id="custom-css-area"></style>
  <style id="dynamic-scale-area"></style>
  <style>
    :root { 
      --accent: #ff9800; --bg: #020202; --panel-bg: rgba(10, 10, 10, 0.9); --text: #ffffff;
      --glass: backdrop-filter: blur(25px) saturate(180%);
      --font-main: 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
      --base-size: 14px; --box-scale: 1;
    }
    body.light-mode { --bg: #f8f9fa; --panel-bg: rgba(255, 255, 255, 0.95); --text: #1a1a1a; }

    body, html { 
      margin: 0; padding: 0; height: 100vh; width: 100vw; overflow: hidden; 
      background: var(--bg); font-family: var(--font-main); color: var(--text); 
      font-size: var(--base-size); transition: 0.4s cubic-bezier(0.2, 0.8, 0.2, 1); 
    }

    /* --- 豪華なアニメーション枠線 --- */
    @keyframes border-glow { 0% { border-color: var(--accent); box-shadow: 0 0 10px var(--accent); } 50% { border-color: #fff; box-shadow: 0 0 25px var(--accent); } 100% { border-color: var(--accent); box-shadow: 0 0 10px var(--accent); } }

    /* --- 起動画面 --- */
    #splash { position: fixed; inset: 0; background: #000; z-index: 10000; display: flex; align-items: center; justify-content: center; background-size: cover; background-position: center; transition: 1.5s cubic-bezier(0.6, 0, 0.4, 1); }
    #splash.hide { opacity: 0; transform: scale(1.04); pointer-events: none; }
    #login-card {
      background: rgba(0,0,0,0.55); backdrop-filter: blur(18px); padding: 42px 36px; border-radius: 28px;
      border: 2px solid var(--accent); text-align: center; width: 420px; position: relative; overflow: hidden;
      animation: border-glow 3.2s infinite;
    }
    #login-card::after {
      content: ''; position: absolute; inset: 0; background: linear-gradient(110deg, transparent 30%, rgba(255,255,255,0.16), transparent 70%);
      transform: translateX(-120%); animation: sheen 2.4s ease-in-out infinite;
    }
    @keyframes sheen { 0% { transform: translateX(-120%); } 100% { transform: translateX(120%); } }
    #load-title { color: var(--accent); letter-spacing: 6px; margin: 0 0 8px; position: relative; }
    #load-status { min-height: 1.4em; opacity: 0.85; margin-bottom: 18px; position: relative; }
    .load-track { height: 10px; border-radius: 99px; background: rgba(255,255,255,0.12); overflow: hidden; position: relative; }
    .load-bar { height: 100%; width: 0%; border-radius: 99px; background: linear-gradient(90deg, var(--accent), #fff); box-shadow: 0 0 16px var(--accent); transition: width 0.35s ease; }
    #load-pct { margin-top: 10px; font-weight: bold; color: var(--accent); position: relative; }
    #chat-panel {
      position: absolute; top: 70px; right: 20px; width: 340px; max-height: 70vh;
      background: var(--panel-bg); backdrop-filter: blur(25px) saturate(180%);
      border: 2px solid var(--accent); border-radius: 25px; padding: 18px;
      display: none; z-index: 5000; box-shadow: 0 30px 70px rgba(0,0,0,0.55);
      flex-direction: column;
    }
    #chat-panel.open { display: flex; }
    #chat-log { flex: 1; overflow-y: auto; min-height: 180px; max-height: 320px; margin: 10px 0; font-size: 0.9rem; }
    #chat-log .row { margin: 6px 0; word-break: break-word; }
    .bm-actions { display: none; gap: 4px; }
    body.edit-on .bm-actions { display: flex; }
    .mini { padding: 4px 8px; border: none; border-radius: 6px; cursor: pointer; font-size: 0.75rem; }

    /* --- ナビゲーション --- */
    #nav { 
      height: calc(60px * var(--box-scale)); background: var(--panel-bg); var(--glass); display: flex; align-items: center; 
      padding: 0 20px; gap: 15px; border-bottom: 3px solid var(--accent); z-index: 1001; 
    }
    #urlInput { 
      flex: 1; padding: 10px 20px; background: rgba(0,0,0,0.6); border: 1px solid var(--accent); 
      color: #00ffcc; border-radius: 50px; outline: none; transition: 0.3s;
    }
    #search-modes { display: flex; gap: 6px; flex-shrink: 0; }
    .mode-btn {
      padding: 7px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.08); color: var(--text); cursor: pointer; font-weight: bold; font-size: 0.8rem;
    }
    .mode-btn.active { background: var(--accent); color: #000; border-color: var(--accent); box-shadow: 0 0 12px var(--accent); }
    #search-panel {
      display: none; position: absolute; inset: 0; z-index: 20;
      background: rgba(0,0,0,0.92); flex-direction: column; overflow: hidden;
    }
    #search-panel.show { display: flex; }
    #search-toolbar {
      display: flex; align-items: center; gap: 10px; padding: 12px 16px;
      border-bottom: 1px solid var(--accent);
    }
    #search-title { flex: 1; font-weight: bold; color: var(--accent); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #search-body { flex: 1; overflow-y: auto; padding: 16px; }
    #search-body.gse-skin { background: #fff; color: #222; }
    #gse-host, #search-body .gsc-control-cse { background: #fff !important; color: #222; border: 0 !important; }
    .sr-item {
      display: flex; gap: 12px; padding: 12px; margin-bottom: 10px;
      background: rgba(255,255,255,0.04); border: 1px solid transparent; border-radius: 10px; cursor: pointer;
    }
    .sr-item:hover { border-color: var(--accent); background: rgba(255,152,0,0.12); }
    .sr-item img { width: 120px; height: 68px; object-fit: cover; border-radius: 6px; background: #111; flex-shrink: 0; }
    .sr-item h4 { margin: 0 0 6px; font-size: 0.95rem; }
    .sr-item p { margin: 0; font-size: 0.8rem; opacity: 0.75; }
    .sr-msg { opacity: 0.8; line-height: 1.6; }
    .btn { padding: 8px 18px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; white-space: nowrap; font-size: 0.9rem; }
    .btn-accent { background: var(--accent); color: #000; box-shadow: 0 0 15px var(--accent); }
    .btn-accent:hover { transform: scale(1.05); filter: brightness(1.2); }

    /* --- メイン領域 --- */
    #main-container { display: flex; height: calc(100% - (60px * var(--box-scale))); position: relative; }
    #sidebar { 
      width: calc(280px * var(--box-scale)); background: var(--panel-bg); var(--glass); border-right: 1px solid rgba(255,255,255,0.1); 
      display: flex; flex-direction: column; overflow: hidden; position: relative; 
    }
    
    /* 【修正】立派になった編集ボックス */
    #edit-box {
      padding: 20px; background: rgba(0, 0, 0, 0.5); border-bottom: 2px solid var(--accent);
      margin-bottom: 5px; display: none;
    }
    #edit-box input {
      width: calc(100% - 24px); padding: 10px; margin-bottom: 10px; background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.2); border-left: 4px solid var(--accent); color: #fff; border-radius: 4px; outline: none;
    }
    #edit-box input:focus { border-color: #fff; background: rgba(255,152,0,0.1); }

    #bookmark-list { flex: 1; overflow-y: auto; padding: 15px; scrollbar-width: thin; }
    
    /* 【修正】分類の開閉スタイル */
    .folder-header { color: var(--accent); font-weight: bold; cursor: pointer; padding: 10px; display: flex; align-items: center; gap: 10px; border-radius: 8px; transition: 0.2s; }
    .folder-header:hover { background: rgba(255,152,0,0.1); }
    .folder-header::before { content: '▶'; font-size: 0.7rem; transition: 0.3s; opacity: 0.5; }
    .folder.open > .folder-header::before { transform: rotate(90deg); opacity: 1; }
    .folder-content { display: none; margin-left: 15px; border-left: 1px solid rgba(255,152,0,0.2); }
    .folder.open > .folder-content { display: block; }

    .bm-item { 
      padding: 10px 15px; background: rgba(255,255,255,0.03); margin: 5px 0; border-radius: 8px; 
      cursor: pointer; display: flex; align-items: center; transition: 0.3s; border: 1px solid transparent;
    }
    .bm-item:hover { border-color: var(--accent); background: rgba(255,152,0,0.15); transform: translateX(5px); }
    /* 連続再生: 再生中の項目ハイライト */
    .bm-item.playing { border-color: var(--accent); background: rgba(255,152,0,0.25); box-shadow: 0 0 12px rgba(255,152,0,0.4); }
    .bm-item.playing > div::before { content: '▶ '; color: var(--accent); }

    /* 連続再生: ナビのコントロール */
    #queue-ctrl { display: none; align-items: center; gap: 8px; }
    #queue-ctrl.show { display: flex; }
    #queue-info { max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 0.8rem; color: var(--accent); font-weight: bold; }

    /* 設定パネル内のチェックボックス行 */
    .config-row label.opt { display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 0.9rem; color: var(--text); font-weight: normal; letter-spacing: 0; margin-bottom: 10px; }
    .config-row label.opt input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); flex-shrink: 0; margin: 0; }
    .config-row .opt-sub { margin-left: 28px; padding-left: 12px; border-left: 2px solid rgba(255,152,0,0.3); transition: opacity 0.3s; }
    .config-row .opt-sub.disabled { opacity: 0.35; pointer-events: none; }

    /* --- 設定パネル --- */
    #config-panel { 
      position: absolute; top: 70px; left: 20px; width: 360px; max-height: 80vh; 
      background: var(--panel-bg); var(--glass); border: 2px solid var(--accent); border-radius: 25px; 
      padding: 30px; display: none; z-index: 5000; overflow-y: auto; box-shadow: 0 30px 70px rgba(0,0,0,1);
    }
    .config-row { margin-bottom: 25px; }
    .config-row label { font-size: 0.8rem; color: var(--accent); font-weight: bold; margin-bottom: 10px; display: block; letter-spacing: 1px; }
    .config-row input[type="range"] { width: 100%; accent-color: var(--accent); }

    #bgm-player { position: fixed; top: -1000px; }
    
    /* リサイズ・ビュー領域固定 */
    #view { flex: 1; height: 100%; background: #000; position: relative; overflow: hidden; }
    #mainFrame { width: 100%; height: 100%; border: none; display: block; }
    #resizer { position: absolute; right: 0; top: 0; width: 5px; height: 100%; cursor: col-resize; z-index: 100; }
  </style>

<style id="pf-theme">
/* ライト/ダークで切り替わる色(固定色で見えなくなるのを防ぐ) */
:root{--btn-bg:rgba(255,255,255,.12);--btn-fg:#fff;--btn-bd:rgba(255,255,255,.22);--field-bg:#111;--field-fg:#fff;--line:rgba(255,255,255,.16);--soft:rgba(255,255,255,.05);--menu-bg:#111;--search-bg:rgba(0,0,0,.92);--on-accent:#000}
body.light-mode{--btn-bg:rgba(0,0,0,.07);--btn-fg:#1a1a1a;--btn-bd:rgba(0,0,0,.25);--field-bg:#fff;--field-fg:#111;--line:rgba(0,0,0,.18);--soft:rgba(0,0,0,.045);--menu-bg:#fff;--search-bg:rgba(248,249,250,.98)}
html.pf-hc body.light-mode{--btn-bd:rgba(0,0,0,.55);--line:rgba(0,0,0,.4);--text:#000;--btn-fg:#000}
html.pf-hc body:not(.light-mode){--btn-bd:rgba(255,255,255,.6);--line:rgba(255,255,255,.45);--text:#fff}
/* 常に暗い面(編集ダイアログ・起動画面)は、ライトモードでも暗い配色に固定 */
#splash,.em-in{--text:#fff;--btn-bg:rgba(255,255,255,.12);--btn-fg:#fff;--btn-bd:rgba(255,255,255,.22);--field-bg:#111;--field-fg:#fff;--line:rgba(255,255,255,.16);--soft:rgba(255,255,255,.05)}
.sm{background:var(--btn-bg);color:var(--btn-fg);box-shadow:inset 0 0 0 1px var(--btn-bd)}
.sm.on{background:var(--accent);color:var(--on-accent);box-shadow:none}
.sm:disabled{opacity:.4;cursor:default}
.tab{background:var(--btn-bg);color:var(--btn-fg)}
.tab.on{background:var(--accent);color:var(--on-accent)}
.btn-accent,.mode-btn.active{color:var(--on-accent)}
.chip{background:var(--btn-bg);box-shadow:inset 0 0 0 1px var(--btn-bd)}
.mode-btn{background:var(--btn-bg);border-color:var(--btn-bd);color:var(--btn-fg)}
.mode-btn.active{background:var(--accent);border-color:var(--accent)}
.sr-item{background:var(--soft);border-color:var(--line)}
.bm-item{background:var(--soft)}
.dd-menu{background:var(--menu-bg)}
.dd-menu button{color:var(--btn-fg)}
.dd-menu button:hover{background:var(--btn-bg)}
#search-panel{background:var(--search-bg)}
body.light-mode #nav>#searchInput,body.light-mode #nav>#urlInput,body.light-mode #urlInput,body.light-mode #modeSel,body.light-mode #ch-sort{background:var(--field-bg);color:var(--field-fg)}
body.light-mode #modeSel option{background:#fff;color:#111}
body.light-mode #nav input::placeholder{color:#6b7280}
.pg h3,.folder-header,#clock,#sleep-badge{color:var(--accent-fg,var(--accent))}

<body class="dark-mode">

  <div id="splash">
    <div id="login-card">
      <h2 id="load-title">weißer Stein</h2>
      <div id="sp-msg" style="display:none;"></div>
      <div id="load-status">起動しています</div>
      <div class="load-track"><div class="load-bar" id="load-bar"></div></div>
      <div id="load-pct">0%</div>
    </div>
  </div>

  <div id="bgm-player"></div>

  <div id="config-panel">
    <h2 style="margin-top:0; border-bottom:2px solid var(--accent); padding-bottom:15px; font-size:1.4rem;">システム設定</h2>
    <div class="config-row">
      <label>🌓 表示モード</label>
      <select id="cfg-mode" onchange="upd('mode', this.value)" style="width:100%; padding:10px; background:var(--field-bg); color:var(--field-fg);">
        <option value="dark">ダーク・ネオン</option>
        <option value="light">ピュア・ライト</option>
      </select>
    </div>
    <div class="config-row">
      <label>🎨 アクセントカラー</label>
      <input type="color" id="cfg-accent" onchange="upd('accent', this.value)" style="width:100%; height:45px; border:none; background:none;">
    </div>
    <div class="config-row">
      <label>📐 文字サイズ: <span id="val-font">14</span>px</label>
      <input type="range" min="10" max="24" value="14" oninput="upd('baseSize', this.value)">
    </div>
    <div class="config-row">
      <label>🔳 ボックスの拡大率: <span id="val-scale">1.0</span>x</label>
      <input type="range" min="0.5" max="1.5" step="0.1" value="1.0" oninput="upd('boxScale', this.value)">
    </div>
    <div class="config-row">
      <label>▶ ジャンル連続再生</label>
      <label class="opt">
        <input type="checkbox" id="cfg-autoplay" onchange="upd('autoPlay', this.checked)">
        同じジャンル(フォルダ)内の動画を続けて再生する
      </label>
      <div class="opt-sub" id="autoplay-sub">
        <label class="opt">
          <input type="checkbox" id="cfg-autoloop" onchange="upd('autoLoop', this.checked)">
          最後まで再生したら最初に戻る(ループ)
        </label>
        <label class="opt">
          <input type="checkbox" id="cfg-autoshuffle" onchange="upd('autoShuffle', this.checked)">
          シャッフル再生
        </label>
      </div>
    </div>
    <div class="config-row"><label class="opt"><input type="checkbox" id="cfg-theater" onchange="setOpt('theater',this.checked)"> 視聴ページを常にワイド表示(全画面に近い表示)にする</label></div>
    <div class="config-row"><label class="opt"><input type="checkbox" id="cfg-openwatch" onchange="setOpenAsWatch(this.checked)"> 通常の動画も視聴ページ（リストから開いたときと同じ画面）で開く</label></div>
    <div class="config-row"><label class="opt"><input type="checkbox" id="cfg-cinema" onchange="setCinema(this.checked)"> シネマモード（周囲を暗くして広く再生）</label></div>
    <div class="config-row"><label>🔎 検索先の表示(YouTubeは常に表示)</label>

    <div style="font-size:0.72rem; opacity:0.7; margin-top:6px;">表示名とアイコンはこの端末に保存されます。ログインは不要です。自分のメッセージだけ編集・削除できます。DMは相手の表示名と一致する人にだけ見えます。</div>

  <script>
    // --- 1. 設定 & 永続化 ---
    let cfg = JSON.parse(localStorage.getItem('os_v17_cfg')) || { 
      mode:'dark', accent:'#ff9800', spBg:'https://images.unsplash.com/photo-1451187580459-43490279c0fa', spMsg:'Welcome to weißer Stein !', css:'', bgm:'', baseSize:14, boxScale:1.0, fontName:'',
      autoPlay:false, autoLoop:false, autoShuffle:false,
      chatName:'User', chatColor:'#ff9800', clock24:true, reduceMotion:false
    };
    let isEditMode = false, openFolders = new Set(), typing = false;

    // --- 連続再生の状態 ---
    let folderItems = {};      // フォルダパス → ブックマーク配列(シート順)
    let current = null;        // 今再生中のブックマーク { id, folder }
    let queue = null;          // 連続再生キュー { folder, list, order, pos }
    let frameIsYT = false;     // mainFrame が YouTube 埋め込みか
    let playToken = 0;         // 読み込みごとに増える(二重発火防止用)
    let endedToken = -1;       // 終了処理済みの playToken
    let frameReady = false;    // 新しい動画の読み込み完了までは終了通知を無視する
    let listenTimer = null;    // YouTube への listening 送信タイマー
    let activeVideoId = '';
    let searchMode = 'youtube';

    function embedUrl(videoId) {
      return 'https://www.youtube-nocookie.com/embed/' + videoId
        + '?autoplay=1&rel=0&modestbranding=1&iv_load_policy=3&playsinline=1&enablejsapi=1';
    }
    const CSE_CX = '669896bde0f0b4cfc';
    let googleCseReady = false;
    let googleCseLoading = false;

    const _nativeOpen = window.open;
    window.open = function (url) {
      if (url && String(url).indexOf('javascript:') !== 0) {
        openInApp(String(url));
        return null;
      }
      return null;
    };
    document.addEventListener('click', function (e) {
      const a = e.target.closest ? e.target.closest('a') : null;
      if (!a) return;
      const href = a.getAttribute('href');
      if (!href || href.charAt(0) === '#' || href.indexOf('javascript:') === 0) return;
      if (a.closest('.gsc-tabsArea, .gsc-cursor-box, .gsc-refinementsArea, .gsc-above-wrapper-area')) return;
      if (/cse\.google\.com|google\.com\/cse|www\.google\.com\/url\?sa=i/i.test(href) && href.indexOf('url=') === -1) return;
      if (href.indexOf('http') === 0 || href.indexOf('//') === 0) {
        e.preventDefault();
        e.stopPropagation();
        openInApp(unwrapGoogleUrl(href));
      }
    }, true);

    function apply() {
      const r = document.documentElement.style;
      r.setProperty('--accent', cfg.accent);
      r.setProperty('--base-size', cfg.baseSize + 'px');
      r.setProperty('--box-scale', cfg.boxScale);
      if(cfg.fontName) r.setProperty('--font-main', cfg.fontName);
      document.body.className = cfg.mode + '-mode';
      document.getElementById('splash').style.backgroundImage = `url('${cfg.spBg}')`;
      const msg = document.getElementById('sp-msg');
      if (msg) msg.innerText = cfg.spMsg || '';
      document.getElementById('custom-css-area').innerHTML = cfg.css || '';
      document.body.classList.toggle('reduce-motion', !!cfg.reduceMotion);
      syncAutoUI();
      syncSettingsForm();
      if(cfg.bgm) {
        let bid = cfg.bgm.includes("v=") ? cfg.bgm.split("v=")[1].split("&")[0] : cfg.bgm;
        const bgmSrc = 'https://www.youtube-nocookie.com/embed/' + bid + '?autoplay=1&loop=1&playlist=' + bid;
        const bgmCur = document.querySelector('#bgm-player iframe');
        if (!bgmCur || bgmCur.getAttribute('src') !== bgmSrc) document.getElementById('bgm-player').innerHTML = '<iframe src="' + bgmSrc + '" allow="autoplay"></iframe>';
      }
    }
    function syncAutoUI() {
      document.getElementById('cfg-autoplay').checked = !!cfg.autoPlay;
      document.getElementById('cfg-autoloop').checked = !!cfg.autoLoop;
      document.getElementById('cfg-autoshuffle').checked = !!cfg.autoShuffle;
      document.getElementById('autoplay-sub').classList.toggle('disabled', !cfg.autoPlay);
    }
    function upd(k, v) {
      cfg[k] = v;
      // 連続再生オプションは BGM の再読み込み(apply)を避け、専用処理のみ行う
      if (k === 'autoPlay' || k === 'autoLoop' || k === 'autoShuffle') {
        syncAutoUI();
        rebuildQueue();
        return;
      }
      apply();
    }
    function syncSettingsForm() {
      const set = (id, v) => { const el = document.getElementById(id); if (el && v != null) el.value = v; };
      set('cfg-mode', cfg.mode);
      set('cfg-accent', cfg.accent);
      set('cfg-bgm', cfg.bgm || '');
      set('cfg-spbg', cfg.spBg || '');
      set('cfg-css', cfg.css || '');
      set('cfg-spmsg', cfg.spMsg || '');
      set('cfg-font', cfg.fontName || '');
      set('cfg-chatname', cfg.chatName || 'User');
      set('cfg-chatcolor', cfg.chatColor || '#ff9800');
      const c24 = document.getElementById('cfg-clock24');
      const mo = document.getElementById('cfg-motion');
      if (c24) c24.checked = cfg.clock24 !== false;
      if (mo) mo.checked = !!cfg.reduceMotion;
      const cn = document.getElementById('chatName');
      const cc = document.getElementById('chatColor');
      if (cn && !cn.value) cn.value = cfg.chatName || 'User';
      if (cc) cc.value = cfg.chatColor || '#ff9800';
    }
    function resetSettings() {
      localStorage.removeItem('os_v17_cfg');
      location.reload();
    }

    // --- 2. ログイン & エンジン (YouTube判定復旧) ---
    function saveSettings() { localStorage.setItem('os_v17_cfg', JSON.stringify(cfg)); alert('保存完了'); }

    function boot() {
      const steps = ['設定を読み込み', 'ブックマークを同期', 'チャットを接続', '準備完了'];
      let i = 0;
      const bar = document.getElementById('load-bar');
      const pct = document.getElementById('load-pct');
      const status = document.getElementById('load-status');
      apply();
      const tick = () => {
        const p = Math.min(100, Math.round((i / steps.length) * 100));
        bar.style.width = p + '%';
        pct.textContent = p + '%';
        status.textContent = steps[Math.min(i, steps.length - 1)];
        if (i === 1) refreshBookmarks();
        if (i === 2) initChat();
        i++;
        if (i <= steps.length) setTimeout(tick, 420);
        else setTimeout(() => { document.getElementById('splash').classList.add('hide'); showHome(); }, 280);
      };
      tick();
    }

    function activeCseCx() {
      return window.CSE_CX_RUNTIME || CSE_CX;
    }

    // 【復旧箇所】YouTube判定ロジック(共通関数化)
    function getVideoId(url) {
      if (!url) return "";
      var s = String(url);
      var m = s.match(/(?:youtu\.be\/|\/shorts\/(?:v=)?|\/embed\/|\/live\/|[?&\/]v=)([A-Za-z0-9_-]{11})/);
      if (m) return m[1];
      if (s.length === 11 && /^[A-Za-z0-9_-]{11}$/.test(s)) return s;
      return "";
    }

    function getXStatusId(url) {
      const m = String(url || '').match(/(?:twitter\.com|x\.com)\/[^/]+\/status\/(\d+)/i);
      return m ? m[1] : '';
    }

    function getXUser(url) {
      const m = String(url || '').match(/(?:twitter\.com|x\.com)\/([A-Za-z0-9_]+)\/?$/i);
      if (!m) return '';
      const skip = { search:1, home:1, explore:1, settings:1, i:1, intent:1, share:1 };
      return skip[m[1].toLowerCase()] ? '' : m[1];
    }

    function looksLikeUrl(text) {
      return /^(https?:\/\/|www\.)/i.test(String(text || '').trim());
    }

    function showSearchPanel(title, html) {
      document.getElementById('search-title').textContent = title || '検索';
      document.getElementById('search-body').innerHTML = html || '';
      document.getElementById('search-body').classList.remove('gse-skin');
      document.getElementById('search-panel').classList.add('show');
    }

    function unwrapGoogleUrl(href) {
      try {
        const u = new URL(href, location.href);
        if (u.hostname.indexOf('google.') !== -1 && u.searchParams.get('url')) {
          return u.searchParams.get('url');
        }
        if (u.hostname.indexOf('google.') !== -1 && u.searchParams.get('q') && /^https?:/.test(u.searchParams.get('q'))) {
          return u.searchParams.get('q');
        }
      } catch (e) {}
      return href;
    }

    function callServer(name, arg, onOk, onNg) {
      try {
        const run = window.google && google.script && google.script.run;
        if (!run) { onNg('NO_RUN'); return; }
        const starter = run.withSuccessHandler(onOk).withFailureHandler(function (err) { onNg(err); });
        const fn = starter[name];
        if (typeof fn !== 'function') { onNg('NO_FN'); return; }
        fn(arg);
      } catch (e) {
        onNg(e);
      }
    }

    function searchYouTube(q) {
      showSearchPanel('YouTube: ' + q, '<div class="sr-msg">検索中...</div>');
      const fallback = function () {
        showCseResults('YouTube: ' + q, 'site:youtube.com ' + q);
      };
      callServer('searchYouTubeFromServer', q, function (res) {
        if (!res || !res.ok || !res.items || !res.items.length) { fallback(); return; }
        const html = res.items.map(function (it) {
          return '<div class="sr-item" data-url="' + String(it.url).replace(/"/g, '') + '">' +
            (it.thumb ? '<img src="' + it.thumb + '" alt="">' : '') +
            '<div><h4>' + escapeHtml(it.title) + '</h4><p>' + escapeHtml(it.channel) + '</p></div></div>';
        }).join('');
        showSearchPanel('YouTube: ' + q, html);
        bindSearchItems();
      }, fallback);
    }

    function searchGoogle(q) {
      showCseResults('Google: ' + q, q);
    }

    function showCseResults(title, query) {
      showSearchPanel(title, '<div id="gse-host">読み込み中...</div>');
      document.getElementById('search-body').classList.add('gse-skin');
      loadGoogleWidget(query);
    }

    function loadGoogleWidget(q) {
      const boot = function () {
        const host = document.getElementById('gse-host');
        if (!host) return;
        host.innerHTML = '';
        try {
          if (window.google && google.search && google.search.cse && google.search.cse.element) {
            try {
              const old = google.search.cse.element.getElement('player-search');
              if (old) google.search.cse.element.clearAll('player-search');
            } catch (e0) {}
            google.search.cse.element.render({
              div: host,
              tag: 'search',
              gname: 'player-search'
            });
            const el = google.search.cse.element.getElement('player-search');
            if (el) el.execute(q);
            return;
          }
        } catch (e) {}
        host.innerHTML = '<div class="gcse-search"></div>';
        const s = document.createElement('script');
        s.src = 'https://cse.google.com/cse.js?cx=' + encodeURIComponent(activeCseCx());
        s.async = true;
        document.head.appendChild(s);
      };

      if (!activeCseCx()) {
        const host = document.getElementById('gse-host');
        if (host) host.innerHTML = '<div class="sr-msg">CSE_CX が未設定です。README.txt を見て、HTML の CSE_CX か Script Properties の CSE_CX を入れてください。</div>';
        return;
      }
      if (googleCseReady) { boot(); return; }
      window.__gcse = window.__gcse || {};
      window.__gcse.parsetags = 'explicit';
      window.__gcse.initializationCallback = function () {
        googleCseReady = true;
        googleCseLoading = false;
        boot();
      };
      if (googleCseLoading) return;
      googleCseLoading = true;
      const s = document.createElement('script');
      s.src = 'https://cse.google.com/cse.js?cx=' + encodeURIComponent(activeCseCx());
      s.async = true;
      s.onerror = function () {
        googleCseLoading = false;
        const host = document.getElementById('gse-host');
        if (host) host.innerHTML = '<div class="sr-msg">検索ウィジェットを読み込めませんでした。ページを開き直してください。</div>';
      };
      document.head.appendChild(s);
    }

    function hideSearchPanel() {
      document.getElementById('search-panel').classList.remove('show');
    }

    function setSearchMode(mode) {
      searchMode = mode;
  const ms = document.getElementById('modeSel'); if (ms) ms.value = mode;
      document.querySelectorAll('.mode-btn').forEach(function (b) {
        b.classList.toggle('active', b.dataset.mode === mode);
      });
      const ph = {
        youtube: 'YouTube検索 / URL / ID',
        x: 'X検索 / 投稿URL / @ユーザー',
        google: 'Google検索 / URL'
      };
      document.getElementById('urlInput').placeholder = ph[mode] || '';
    }

    function submitBar() {
      const q = document.getElementById('urlInput').value.trim();
      if (!q) return;
      if (looksLikeUrl(q) || getVideoId(q) || getXStatusId(q)) {
        openInApp(q);
        return;
      }
      if (searchMode === 'youtube') searchYouTube(q);
      else if (searchMode === 'x') searchX(q);
      else searchGoogle(q);
    }

    function openInApp(raw) {
      let url = String(raw || '').trim();
      if (!url) return;
      hideSearchPanel();
      if (url.indexOf('www.') === 0) url = 'https://' + url;

      const yt = getVideoId(url);
      if (yt) {
        loadContent(yt, false);
        return;
      }

      const xid = getXStatusId(url);
      if (xid) {
        showXEmbed(xid);
        return;
      }

      const user = getXUser(url);
      if (user) {
        showXTimeline(user);
        return;
      }

      loadContent(url, false);
    }

    function writeFrameDoc(html) {
      const f = document.getElementById('mainFrame');
      playToken++;
      frameIsYT = false;
      frameReady = false;
      stopListening();
      current = null;
      queue = null;
      updateNowPlaying();
      f.removeAttribute('src');
      f.srcdoc = html;
    }

    function showXEmbed(id) {
      document.getElementById('urlInput').value = 'https://x.com/i/status/' + id;
      writeFrameDoc(
        '<!DOCTYPE html><html><head><meta charset="utf-8"><base target="_self">' +
        '<style>html,body{margin:0;background:#000;color:#fff;display:flex;justify-content:center;padding:16px;}</style></head><body>' +
        '<blockquote class="twitter-tweet" data-theme="dark"><a href="https://x.com/i/status/' + id + '"></a></blockquote>' +

    function bindSearchItems() {
      document.querySelectorAll('#search-body .sr-item').forEach(function (el) {
        el.onclick = function () { openInApp(el.getAttribute('data-url')); };
      });
    }

    function escapeHtml(s) {
      return String(s || '').replace(/[&<>"']/g, function (c) {
        return ({ '&':'&', '<':'<', '>':'>', '"':'"', "'":'&#39;' })[c];
      });
    }

    function searchX(q) {
      const raw = q.replace(/^@/, '').trim();
      if (/^[A-Za-z0-9_]{1,15}$/.test(raw) && q.charAt(0) === '@') {
        showXTimeline(raw);
        return;
      }
      const url = 'https://x.com/search?q=' + encodeURIComponent(q) + '&src=typed_query&f=live';
      hideSearchPanel();
      loadContent(url, false);
    }

    // keepQueue=true のときだけ連続再生キューを維持(ブックマーク/キュー経由)
    function loadContent(url, keepQueue) {
      if (!url) return;
      const f = document.getElementById('mainFrame');
      document.getElementById('urlInput').value = url;
      let final = url;

      if (!keepQueue) {          // URL欄からの手入力などはキューを解除
        current = null;
        queue = null;
        updateNowPlaying();
      }

      const videoId = getVideoId(url);
      if (videoId && !String(url).includes('listType=search')) {
        activeVideoId = videoId;
        final = embedUrl(videoId);
      } else if (!url.startsWith('http')) { 
        activeVideoId = '';
        final = "https://" + url; 
      } else {
        activeVideoId = '';
      }

      playToken++;
      frameIsYT = !!videoId;
      frameReady = false;        // 読み込み完了(load)まで、旧ページからの通知を無視
      stopListening();
      f.src = final;
    }

    // --- 連続再生エンジン ---
    // YouTube埋め込みは enablejsapi=1 なら postMessage で再生状態を通知してくれる
    function stopListening() { if (listenTimer) { clearInterval(listenTimer); listenTimer = null; } }

    function postToPlayer(obj) {
      try { document.getElementById('mainFrame').contentWindow.postMessage(JSON.stringify(obj), '*'); } catch (e) {}
    }

    function startListening() {
      stopListening();
      let n = 0;
      // プレイヤーの準備ができるまで listening を繰り返し送る(最初の応答で停止)
      listenTimer = setInterval(() => {
        postToPlayer({ event: 'listening', id: 1, channel: 'widget' });
        if (++n > 60) stopListening();   // 約15秒で打ち切り
      }, 250);
    }

    document.getElementById('mainFrame').addEventListener('load', () => {
      frameReady = true;
      if (frameIsYT) startListening();
    });

    window.addEventListener('message', (e) => {
      const f = document.getElementById('mainFrame');
      if (e.source !== f.contentWindow) return;          // mainFrame 以外は無視
      if (!frameReady) return;                           // 切替直後の旧ページからの通知は無視
      let d = e.data;
      if (typeof d === 'string') { try { d = JSON.parse(d); } catch (err) { return; } }
      if (!d || typeof d !== 'object') return;

      // 最初の応答が来たら、状態変化・エラーの通知を購読する
      if (listenTimer) {
        stopListening();
        postToPlayer({ event: 'command', func: 'addEventListener', args: ['onStateChange'], id: 1, channel: 'widget' });
        postToPlayer({ event: 'command', func: 'addEventListener', args: ['onError'], id: 1, channel: 'widget' });
      }

      if (d.event === 'onStateChange' && d.info === 0) onVideoEnded();
      else if (d.event === 'infoDelivery' && d.info && d.info.playerState === 0) onVideoEnded();
      else if (d.event === 'onError') onVideoError();
      keepSuggestedInside(d);
    });

    function keepSuggestedInside(d) {
      const info = d && d.info;
      if (!info) return;
      const next = (info.videoData && info.videoData.video_id)
        || getVideoId(info.videoUrl || '')
        || getVideoId(info.video_url || '');
      if (!next || next === activeVideoId) return;
      activeVideoId = next;
      const f = document.getElementById('mainFrame');
      document.getElementById('urlInput').value = 'https://www.youtube.com/watch?v=' + next;
      frameIsYT = true;
      frameReady = false;
      playToken++;
      f.src = embedUrl(next);
    }

    function onVideoEnded() {
      if (!queue) return;
      if (endedToken === playToken) return;              // 二重通知を防ぐ
      endedToken = playToken;
      queueStep(1, true);
    }

    // 埋め込み不可・削除済みなどの動画は少し待ってスキップ
    function onVideoError() {
      if (!queue) return;
      if (endedToken === playToken) return;
      endedToken = playToken;
      const tk = playToken;
      setTimeout(() => { if (tk === playToken) queueStep(1, true); }, 1500);
    }

    function shuffleArray(a) {
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    // folder 内の「YouTube動画のみ」でキューを作る(通常サイトは連続再生の対象外)
    function buildQueue(folder, curId) {
      const list = (folderItems[folder] || []).filter(b => getVideoId(b.url));
      const start = list.findIndex(b => b.id === curId);
      if (start < 0) return null;
      let order = list.map((_, i) => i);
      if (cfg.autoShuffle) {
        order = shuffleArray(order.filter(i => i !== start));
        order.unshift(start);                            // 今の動画を先頭に
        return { folder, list, order, pos: 0 };
      }
      return { folder, list, order, pos: start };
    }

    function rebuildQueue() {
      queue = current ? buildQueue(current.folder, current.id) : null;
      updateNowPlaying();
    }

    // dir: +1=次 / -1=前 / auto: 動画終了による自動送りか
    function queueStep(dir, auto) {
      if (!queue || !queue.order.length) return;
      const len = queue.order.length;
      let p = queue.pos + dir;
      if (p >= len) {
        if (cfg.autoLoop) p = 0;
        else {
          document.getElementById('queue-info').textContent = '✔ 「' + qLabel(queue.folder) + '」を最後まで再生しました';
          return;
        }
      }
      if (p < 0) p = cfg.autoLoop ? len - 1 : 0;
      queue.pos = p;
      playQueueItem();
    }

    function playQueueItem() {
      const bm = queue.list[queue.order[queue.pos]];
      current = { id: bm.id, folder: queue.folder };
      loadContent(bm.url, true);
      updateNowPlaying();
    }

    // ブックマーククリック時: 連続再生ONならそのフォルダでキューを作る
    function playBookmark(bm, folder) {
      if (getVideoId(bm.url)) {
        current = { id: bm.id, folder: folder };
        queue = buildQueue(folder, bm.id);
      } else {
        current = null;
        queue = null;
      }
      loadContent(bm.url, true);
      updateNowPlaying();
    }

    // サイドバーのハイライトとナビ表示を更新
    function updateNowPlaying() {
      const ctrl = document.getElementById('queue-ctrl');
      const info = document.getElementById('queue-info');
      document.querySelectorAll('#bookmark-list .bm-item').forEach(el => {
        el.classList.toggle('playing', !!current && el.dataset.id === String(current.id));
      });
      if (queue) {
        const bm = queue.list[queue.order[queue.pos]];
        ctrl.classList.add('show');
        info.textContent = '📁 ' + qLabel(queue.folder) + '  ' + (queue.pos + 1) + '/' + queue.order.length + '  ' + bm.name;
        info.title = info.textContent;
        const el = document.querySelector('#bookmark-list .bm-item.playing');
        if (el) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      } else {
        ctrl.classList.remove('show');
        info.textContent = '';
      }
    }

    // --- 3. ブックマーク & ドラッグ分類 (開閉機能追加) ---
    function toggleEditMode() {
      isEditMode = !isEditMode;
      document.getElementById('modeBtn').innerText = isEditMode ? '📝 編集モード' : '閲覧モード';
      document.getElementById('edit-box').style.display = isEditMode ? 'block' : 'none';
      document.body.classList.toggle('edit-on', isEditMode);
      refreshBookmarks();
    }

    function refreshBookmarks() {
      if (typeof google === 'undefined') return;
      google.script.run.withSuccessHandler(renderTree).getBookmarkList();
    }

    function renderTree(items) {
      const listDiv = document.getElementById('bookmark-list'); listDiv.innerHTML = "";
      const root = {};
      folderItems = {};   // 連続再生用: フォルダパス → 項目配列(シート順)
      items.forEach(item => {
        const [path, url] = item.content.split(" | ");
        const parts = path.split("/"); let cur = root;
        parts.forEach((p, i) => {
          if (i === parts.length - 1) {
            if(!cur._items) cur._items = [];
            const entry = { id: item.id, name: p, url: url, full: path };
            cur._items.push(entry);
            const folderPath = parts.slice(0, -1).join("/");
            (folderItems[folderPath] = folderItems[folderPath] || []).push(entry);
          } else {
            if (!cur[p]) cur[p] = {}; cur = cur[p];
          }
        });
      });

      function build(obj, container, curP = "") {
        Object.keys(obj).filter(k => k !== "_items").sort().forEach(k => {
          const path = (curP ? curP + "/" : "") + k;
          const f = document.createElement('div'); f.className = 'folder' + (openFolders.has(path) ? ' open' : '');
          f.innerHTML = `<div class="folder-header">📁 ${k}</div><div class="folder-content"></div>`;
          f.querySelector('.folder-header').onclick = (e) => { 
            e.stopPropagation();
            f.classList.toggle('open'); 
            f.classList.contains('open') ? openFolders.add(path) : openFolders.delete(path); 
          };
          build(obj[k], f.querySelector('.folder-content'), path); container.appendChild(f);
        });
        if (obj._items) {
          obj._items.forEach(bm => {
            const d = document.createElement('div'); d.className = 'bm-item';
            d.dataset.id = String(bm.id);
            d.innerHTML = `<div style="flex:1">${bm.name}</div><div class="bm-actions"><button class="mini" data-act="edit">編集</button><button class="mini" data-act="del">削除</button></div>`;
            d.onclick = (ev) => {
              const act = ev.target && ev.target.dataset ? ev.target.dataset.act : '';
              if (act === 'del') { ev.stopPropagation(); deleteBookmark(bm.id); return; }
              if (act === 'edit' || isEditMode) { fillEdit(bm); return; }
              playBookmark(bm, bm.full.split('/').slice(0,-1).join('/'));
            };
            container.appendChild(d);
          });
        }
      }
      build(root, listDiv);

      // 再描画後も再生中のハイライトと連続再生キューを維持
      if (current) {
        const still = (folderItems[current.folder] || []).some(b => b.id === current.id);
        if (!still) current = null;                       // 削除・移動された場合は解除
      }
      rebuildQueue();
    }

    function saveBookmark() {
      const p = document.getElementById('bmPath').value, n = document.getElementById('bmName').value, u = document.getElementById('bmUrl').value, id = document.getElementById('editId').value;
      if(!n || !u) return;
      const content = (p ? p + "/" + n : n) + " | " + u;
      if(id) {
        google.script.run.withSuccessHandler(() => { google.script.run.withSuccessHandler(refreshBookmarks).addBookmarkToSheet(content); clearEdit(); }).deleteBookmarkFromServer(id);
      } else {
        google.script.run.withSuccessHandler(refreshBookmarks).addBookmarkToSheet(content); clearEdit();
      }
    }
    function fillEdit(bm) {
      document.getElementById('editId').value = bm.id;
      document.getElementById('bmPath').value = bm.full.split('/').slice(0,-1).join('/');

    }
    function deleteBookmark(id) {
      if (!id || !confirm('この項目を削除しますか？')) return;
      google.script.run.withSuccessHandler(refreshBookmarks).deleteBookmarkFromServer(id);
      clearEdit();
    }
    function deleteEditing() { deleteBookmark(document.getElementById('editId').value); }
    function addCurrentUrl() {
      document.getElementById('bmUrl').value = document.getElementById('urlInput').value || '';
    }
    function clearEdit() { document.getElementById('editId').value = ''; document.getElementById('bmName').value = ''; document.getElementById('bmUrl').value = ''; }

    // --- 4. チャット & インターフェース制御 ---
    function initChat() {
      const name = document.getElementById('chatName');
      const color = document.getElementById('chatColor');
      name.value = cfg.chatName || localStorage.getItem('chat_name') || 'User';
      color.value = cfg.chatColor || '#ff9800';
      loadChat();
      setInterval(loadChat, 4000);
      setInterval(() => syncPresence(false), 8000);
    }
    function setTyping(on) { syncPresence(!!on); }
    function syncPresence(isTyping) {
      if (typeof google === 'undefined') return;
      const n = document.getElementById('chatName').value || 'User';
      const c = document.getElementById('chatColor').value || '#ff9800';
      google.script.run.withSuccessHandler(st => {
        if (!st) return;
        const box = document.getElementById('chat-online');
        const typing = (st.typing || []).join(', ');
        box.textContent = 'オンライン: ' + ((st.online || []).join(', ') || 'なし') + (typing ? ' / 入力中: ' + typing : '');
      }).syncStatus(n, isTyping, c);
    }
    function sendChat() {
      const n = document.getElementById('chatName').value.trim();
      const m = document.getElementById('chatMsg').value.trim();
      const c = document.getElementById('chatColor').value;
      if (!n || !m) return;
      cfg.chatName = n; cfg.chatColor = c;
      localStorage.setItem('chat_name', n);
      localStorage.setItem('os_v17_cfg', JSON.stringify(cfg));
      google.script.run.withSuccessHandler(loadChat).postMsg(n, m, c, 'viewer');
      document.getElementById('chatMsg').value = '';
      setTyping(false);
    }
    function chatSafeColor(c) { c = String(c || ''); return /^#[0-9a-fA-F]{3,8}$/.test(c) ? c : 'var(--text)'; }
    function chatRowHtml(r) {
      var t = E(r[1]).replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1">$1</a>');
      return '<div class="row" style="color:' + chatSafeColor(r[2]) + '"><b>' + E(r[0]) + ':</b> ' + t + '</div>';
    }
    function loadChat() {
      if (typeof google === 'undefined') return;
      google.script.run.withSuccessHandler(data => {
        const log = document.getElementById('chat-log');
        const nearBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 40;
        log.innerHTML = (data || []).map(chatRowHtml).join('');
        if (nearBottom) log.scrollTop = log.scrollHeight;
        chatNotify(data);
      }).getMsgs();
    }

    function savedChannels() {
      try { return JSON.parse(localStorage.getItem('ws_channels') || '[]'); } catch (e) { return []; }
    }
    function saveChannels(list) {
      localStorage.setItem('ws_channels', JSON.stringify(list.slice(0, 30)));
      renderSaved();

    function renderSaved() {
      const box = document.getElementById('saved-channels');
      if (!box) return;
      const list = savedChannels();
      box.innerHTML = list.length ? list.map(c => '<div>' + c.title + ' <button onclick="dropChannel(\'' + c.id + '\')">外す</button></div>').join('') : '保存チャンネルなし';

    function dropChannel(id) { saveChannels(savedChannels().filter(c => c.id !== id)); }
    function toggleAccount() {
      const p = document.getElementById('account-panel');

      const who = localStorage.getItem('ws_user') || '';

    function sendCode() {
      const email = ((document.getElementById('acct-email') || {}).value || '');
      const box = document.getElementById('acct-status');
      box.textContent = '送信中...';
      google.script.run
        .withSuccessHandler(r => {
          if (!(r && r.ok)) { box.textContent = '送れませんでした: ' + ((r && r.reason) || ''); return; }
          box.textContent = 'メールを送りました(送信元: ' + (r.from || '不明') + ' → ' + (r.to || email) + ')。10分以内に入力してください。' +
            (r.sentCopy === false ? ' ※Gmailの送信済みに見つかりません。' : '') + ' 届かない場合は「迷惑メール」「すべてのメール」を確認するか、下の「このGoogleアカウントでログイン」を使ってください。';
        })
        .withFailureHandler(err => {
          box.textContent = '送信失敗: ' + err + '。スプレッドシートの「その他 → メール送信を許可」を一度実行してください。';
        })
        .requestLoginCode(email);
    }
    function acctLogout() {
      localStorage.removeItem('ws_user');
      document.getElementById('acct-status').textContent = '未ログイン（仮登録可）。使いたいGmailを入力して「6桁コードを送信」→「コードでログイン」を使ってください。';
    }
    function googleLogin() {
      const box = document.getElementById('acct-status');
      box.textContent = '確認中...';
      google.script.run.withSuccessHandler(r => {
        if (!r || !r.ok) { box.textContent = 'ログインできませんでした: ' + ((r && r.reason) || ''); return; }

<script>
/* ===== 追加機能: ホーム / 視聴ページ / チャンネル / Shorts / マイルーム ===== */
var ROOM = { view: null, keys: [], path: '' };
const E = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => '&#' + c.charCodeAt(0) + ';');
const AV = () => document.getElementById('app-view');
const CH = {};   // channelId -> {id,title,thumb}
const subsCsv = () => savedChannels().map(c => c.id).join(',');
/* よく見るチャンネルほど多く出す: 視聴回数 → 重み */
function watchCounts() { try { return JSON.parse(localStorage.getItem('ws_watch') || '{}'); } catch (e) { return {}; } }
function bumpWatch(cid) {
  if (!cid) return;
  try {
    var c = watchCounts(); c[cid] = (c[cid] || 0) + 1;
    var tot = 0; Object.keys(c).forEach(function (k) { tot += c[k]; });
    if (tot > 200) Object.keys(c).forEach(function (k) { c[k] = Math.floor(c[k] / 2); if (!c[k]) delete c[k]; });   // 古い履歴は徐々に薄める
    localStorage.setItem('ws_watch', JSON.stringify(c));
  } catch (e) {}
}
function weightedPick(k) {
  var cnt = watchCounts();
  var pool = savedChannels().map(function (c) { return { id: c.id, w: 1 + Math.min(cnt[c.id] || 0, 30) * 1.5 }; });
  var out = [];
  while (out.length < k && pool.length) {
    var tot = pool.reduce(function (a, x) { return a + x.w; }, 0), r = Math.random() * tot, i = 0;
    for (; i < pool.length - 1; i++) { r -= pool[i].w; if (r <= 0) break; }
    out.push(pool.splice(i, 1)[0]);
  }
  return out;
}
function subsSpec(k, total) {   // "チャンネルID:本数" をカンマ区切りで返す(視聴の多いチャンネルは本数が多い)
  var pick = weightedPick(k), sum = pick.reduce(function (a, x) { return a + x.w; }, 0);
  return pick.map(function (x) { return x.id + ':' + Math.max(1, Math.min(8, Math.round(total * x.w / sum))); }).join(',');
}
function watchIds(k) { return weightedPick(k).map(function (x) { return x.id; }).join(','); }
const isSub = id => savedChannels().some(c => c.id === id);
const fmtN = n => n == null ? '非公開' : (n >= 1e8 ? (n / 1e8).toFixed(1) + '億' : n >= 1e4 ? (n / 1e4).toFixed(1) + '万' : String(n));
function srv(fn, args, ok) {
  try {
    const r = google.script.run.withSuccessHandler(ok).withFailureHandler(e => ok({ ok: false, reason: String(e), items: [] }));
    r[fn].apply(r, args);
  } catch (e) { ok({ ok: false, reason: 'NO_RUN', items: [] }); }
}
function showApp(html, noscroll) {
  const a = AV(); a.innerHTML = html; a.scrollTop = 0;
  a.classList.add('show'); a.classList.toggle('noscroll', !!noscroll); hideSearchPanel();
}
function hideApp() {
  ROOM.view = null; AV().classList.remove('show'); AV().innerHTML = ''; }
function stopMain() { const f = document.getElementById('mainFrame'); playToken++; frameIsYT = false; stopListening(); f.removeAttribute('src'); f.removeAttribute('srcdoc'); }
function tabs(on) {
  ROOM.view = null;
  const t = [['h', '🏠 ホーム', 'showHome()'], ['s', '⚡ Shorts', 'showShorts()'], ['r', '🚪 マイルーム', 'showRoom()'], ['c', '📺 登録チャンネル', 'showChannels()'], ['n', '🔔 通知', 'showNotifs()']];
  const chips = savedChannels().map(c => `<div class="chip" onclick="openChannel('${E(c.id)}')"><img src="${E(c.thumb)}" alt="">${E(c.title)}</div>`).join('');
  return '<div class="tabs">' + t.map(x => `<div class="tab${x[0] === on ? ' on' : ''}" onclick="${x[2]}">${x[1]}</div>`).join('') + chips + '</div>';
}
function card(v) {
  return `<div class="vc" onclick="openWatch('${E(v.id)}')"><img loading="lazy" src="${E(v.thumb)}" alt=""><div class="vt">${E(v.title)}</div><div class="vm"><a onclick="event.stopPropagation();openChannel('${E(v.channelId)}')">${E(v.channel)}</a></div></div>`;
}
function grid(items) { return items && items.length ? items.map(card).join('') : '<div class="sr-msg">動画がありません</div>'; }

/* --- ホーム --- */
function showHome() {
  showApp(tabs('h') + '<div class="pg"><h3>🎬 おすすめ</h3><div id="h-recs" class="grid"><div class="sr-msg">読み込み中...</div></div><h3>⚡ Shorts</h3><div id="h-sh" class="shelf"><div class="sr-msg">読み込み中...</div></div></div>');
  const hrEl = () => document.getElementById('h-recs');
  srv('getRecommendationsForChannels', [subsSpec(8, 18)], r => {
    const el = hrEl(); if (!el) return;
    if (!(r && r.ok)) { el.innerHTML = '<div class="sr-msg">取得できません: ' + errMsg(r) + '</div>'; return; }
    el.innerHTML = grid(r.items);
    if (cfg.recBookmarks) {
      const smp = bmSample(8);
      if (smp.length) srv('getRecsFromBookmarks', [smp.join(',')], r2 => {
        const e2 = hrEl(); if (!e2 || !r2 || !r2.ok) return;
        const seen = {}, mix = [], a = r.items.slice(), b = r2.items.slice();
        while (a.length || b.length) [a.shift(), b.shift()].forEach(x => { if (x && !seen[x.id]) { seen[x.id] = 1; mix.push(x); } });
        e2.innerHTML = grid(mix);
      });
    }
  });
  const wp = weightedPick(1), pick = wp.length ? wp[0].id : '';
  srv('getShortsPage', [pick, ''], r => {
    const el = document.getElementById('h-sh'); if (!el) return;
    el.innerHTML = r && r.items && r.items.length ? r.items.map(v => `<div class="sc" onclick="showShorts()"><img src="${E(v.thumb)}" alt=""><div class="vt">${E(v.title)}</div></div>`).join('') : '<div class="sr-msg">Shortsを取得できません</div>';
  });
}

/* --- 視聴ページ --- */
let W = { id: '', cid: '', title: '' };
function openWatch(id) {
  if (!id) return; stopMainForce(); W = { id: id, cid: '', title: '' };
  document.getElementById('urlInput').value = 'https://www.youtube.com/watch?v=' + id;
  showApp(tabs('') + `<div class="pg wp"><div class="wl"><div class="pw"><iframe id="wp-frame" onload="pfAfterLoad(this)" src="${embedUrl(id)}" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe></div>
    <h2 id="w-title" style="margin:12px 0 4px">読み込み中...</h2><div class="crow" id="w-ch"></div>
    <div class="wbar"><button class="sm" onclick="addToList()">＋ リストに入れる</button><button class="sm" onclick="setTheater(!document.body.classList.contains('theater'))">🖥 ワイド表示</button><button class="sm" onclick="goFull()">⛶ 全画面</button><button class="sm" onclick="navigator.clipboard&&navigator.clipboard.writeText('https://youtu.be/${E(id)}')">🔗 URLコピー</button></div></div>
    <div class="wr"><h3 style="margin-top:0">次のおすすめ</h3><div id="w-recs"><div class="sr-msg">読み込み中...</div></div></div></div>`);
  if (cfg.theater) setTheater(true);
  const wf = document.getElementById('wp-frame'); if (wf) wf.addEventListener('load', () => { AV().scrollTop = 0; });
  srv('getWatchData', [id, watchIds(4), cfg.recBookmarks ? bmSample(6).filter(x => x !== id).join(',') : '', subsCsv()], r => {
    if (W.id !== id || !document.getElementById('w-title')) return;
    if (!r || !r.ok) { document.getElementById('w-title').textContent = '(情報を取得できません)'; document.getElementById('w-recs').innerHTML = '<div class="sr-msg">' + errMsg(r) + '</div>'; return; }
    W.title = r.title; W.cid = r.channel.id; CH[r.channel.id] = r.channel; bumpWatch(r.channel.id); saveGenre(r.genre); histAdd({ id: id, title: r.title, channel: r.channel.title, channelId: r.channel.id, thumb: 'https://i.ytimg.com/vi/' + id + '/mqdefault.jpg' });
    document.getElementById('w-title').textContent = r.title;
    document.getElementById('w-ch').innerHTML = chRow(r.channel) + `<span class="vm">👁 ${fmtN(r.views)} 回視聴</span>`;
    document.getElementById('w-recs').innerHTML = pfFilter(r.items).map(v => `<div class="rc" onclick="openWatch('${E(v.id)}')"><img loading="lazy" src="${E(v.thumb)}" alt=""><div><div class="vt">${E(v.title)}</div><div class="vm">${E(v.channel)}${v.disc ? ' ・ 🔭 近いジャンル' : ''}</div></div></div>`).join('');
  });
}
function chRow(c) {
  return `<img class="av" style="width:40px;height:40px;cursor:pointer" src="${E(c.thumb)}" onclick="openChannel('${E(c.id)}')" alt=""><b style="cursor:pointer" onclick="openChannel('${E(c.id)}')">${E(c.title)}</b><span class="vm">登録者 ${fmtN(c.subs)}</span>` + subBtn(c.id);
}
function subBtn(id) { const on = isSub(id); return `<button class="sm subbtn ${on ? 'on' : ''}" data-id="${E(id)}" onclick="toggleSub('${E(id)}')">${on ? '✔ 仮登録済み' : '＋ チャンネル仮登録'}</button>`; }
function toggleSub(id) {
  const c = CH[id]; if (!c) return;
  const list = savedChannels(), had = list.some(x => x.id === id);
  saveChannels(had ? list.filter(x => x.id !== id) : [{ id: c.id, title: c.title, thumb: c.thumb }].concat(list));
  document.querySelectorAll('.subbtn[data-id="' + id + '"]').forEach(b => { b.outerHTML = subBtn(id); });
}
function addToList() {
  if (!W.id) return;
  const folder = prompt('追加するリスト(フォルダ)名', 'マイリスト'); if (!folder) return;
  const name = (W.title || W.id).replace(/[\/|]/g, ' ');
  google.script.run.withSuccessHandler(() => { refreshBookmarks(); alert('「' + folder + '」に追加しました(マイルームで確認できます)'); }).addBookmarkToSheet(folder + '/' + name + ' | ' + W.id);
}
function setTheater(on) { document.body.classList.toggle('theater', !!on); }
function goFull() {
  const el = document.querySelector('.pw'); if (!el) return;
  try { (el.requestFullscreen || el.webkitRequestFullscreen).call(el); } catch (e) { setTheater(true); }
  setTimeout(() => { if (!document.fullscreenElement) setTheater(true); }, 400);   // 全画面が禁止された環境ではワイド表示に切替
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') setTheater(false); });

/* --- チャンネル疑似ページ --- */
function openChannel(id) {
  if (!id) return; stopMain();
  showApp(tabs('') + '<div class="pg"><div class="sr-msg">読み込み中...</div></div>');
  srv('getChannelPage', [id], r => {
    if (!r || !r.ok) { showApp(tabs('') + '<div class="pg sr-msg">取得できません: ' + errMsg(r) + '</div>'); return; }
    const c = r.channel; CH[c.id] = c;
    showApp(tabs('') + `<div class="pg"><div class="ban" style="${c.banner ? "background-image:url('" + E(c.banner) + "')" : ''}"></div>
      <div class="chh"><img src="${E(c.thumb)}" alt=""><div style="flex:1;min-width:200px"><h2 style="margin:0">${E(c.title)}</h2>
      <div class="vm">${E(c.handle)} ・ 登録者 ${fmtN(c.subs)} ・ 動画 ${fmtN(c.videoCount)}本</div>
      <div class="vm" style="margin:6px 0;max-height:3.2em;overflow:hidden">${E(c.desc)}</div>${subBtn(c.id)}</div></div>
      <h3>動画</h3><div class="grid">${grid(r.items)}</div></div>`);
  });
}

/* --- Shorts (登録チャンネルから推測して連続表示) --- */
let SH = { tok: {}, seen: {}, busy: false, io: null, n: 0 };
function showShorts() {
  stopMain(); SH = { tok: {}, seen: {}, busy: false, io: null, n: 0 };
  showApp(tabs('s') + '<div id="sh-feed"></div><div class="sh-nav"><button title="前 (↑)" onclick="shStep(-1)">▲</button><button title="次 (↓)" onclick="shStep(1)">▼</button></div>', true);
  const feed = document.getElementById('sh-feed');
  SH.io = new IntersectionObserver(es => es.forEach(en => {
    const el = en.target, f = el.querySelector('.sf');
    if (en.isIntersecting) {
      if (!f.firstChild) f.innerHTML = `<iframe allow="autoplay; encrypted-media; fullscreen" allowfullscreen src="https://www.youtube-nocookie.com/embed/${el.dataset.id}?autoplay=1&loop=1&playlist=${el.dataset.id}&rel=0&playsinline=1"></iframe>`;
      if (+el.dataset.i >= SH.n - 3) loadShorts();
    } else f.innerHTML = '';
  }), { root: feed, threshold: 0.6 });
  loadShorts(); loadShorts();
}
function loadShorts() {
  if (SH.busy) return; SH.busy = true;
  const wp = weightedPick(1), cid = wp.length && Math.random() < 0.8 ? wp[0].id : '';
  const key = cid || '_';
  srv('getShortsPage', [cid, SH.tok[key] || ''], r => {
    SH.busy = false;
    const feed = document.getElementById('sh-feed'); if (!feed) return;
    if (!r || !r.ok) { if (!SH.n) feed.innerHTML = '<div class="sr-msg" style="padding:20px">Shortsを取得できません: ' + errMsg(r) + '</div>'; return; }
    SH.tok[key] = r.next || '';
    r.items.forEach(v => {
      if (SH.seen[v.id]) return; SH.seen[v.id] = 1;
      const d = document.createElement('div'); d.className = 'sh'; d.dataset.id = v.id; d.dataset.i = SH.n++;
      d.innerHTML = `<div class="sf"></div><div class="vm" style="max-width:90%;text-align:center"><b>${E(v.title)}</b> ・ <a style="cursor:pointer" onclick="openChannel('${E(v.channelId)}')">${E(v.channel)}</a></div>`;
      feed.appendChild(d); SH.io.observe(d);
    });
    if (!SH.n && !cid) feed.innerHTML = '<div class="sr-msg" style="padding:20px">表示できるShortsがありません</div>';
  });
}

<script>

<script>
/* ===== PART D: 検索結果の大型カード / チャンネルページ(動画・ショート・検索) / ループボタン ===== */
function ago(iso) {
  if (!iso) return '';
  var s = (Date.now() - new Date(iso).getTime()) / 1000; if (s < 0) s = 0;
  var u = [[31536000, '年'], [2592000, 'か月'], [604800, '週間'], [86400, '日'], [3600, '時間'], [60, '分']];
  for (var i = 0; i < u.length; i++) { if (s >= u[i][0]) return Math.floor(s / u[i][0]) + u[i][1] + '前'; }
  return 'たった今';
}
function metaLine(v) {
  var a = [];
  if (v.views != null) a.push(fmtN(v.views) + ' 回視聴');
  if (v.published) a.push(ago(v.published));
  return E(a.join(' ・ '));
}
function ytCardLarge(v) {
  return '<div class="ytc" onclick="openWatch(\'' + E(v.id) + '\')"><div class="ytc-th"><img loading="lazy" src="' + E(v.thumbHi || v.thumb) + '" alt="">' +
         (v.durText ? '<span class="dur">' + E(v.durText) + '</span>' : '') + '</div>' +
         '<div class="ytc-t">' + E(v.title) + '</div>' +
         '<div class="ytc-m"><a onclick="event.stopPropagation();openChannel(\'' + E(v.channelId) + '\')">' + E(v.channel) + '</a></div>' +
         '<div class="ytc-m">' + metaLine(v) + '</div></div>';
}
function shCard(v) {
  return '<div class="shc" onclick="openWatch(\'' + E(v.id) + '\')"><div class="shc-th"><img loading="lazy" src="' + E(v.thumbHi || v.thumb) + '" alt=""></div>' +
         '<div class="ytc-t">' + E(v.title) + '</div><div class="ytc-m">' + (v.views != null ? E(fmtN(v.views)) + ' 回視聴' : '') + '</div></div>';
}
function moreBtn(fn) { return '<div style="text-align:center;margin:18px"><button class="sm on" onclick="' + fn + '">もっと見る</button></div>'; }

/* --- YouTube 検索(上部の検索欄): サムネ大 → 下にタイトル / チャンネル / 再生回数 --- */
var YS = { q: '', next: '' };
function searchYouTube(q) {
  YS.q = q; YS.next = '';
  showSearchPanel('YouTube: ' + q, '<div class="sr-msg">検索中...</div>');
  var fallback = function () { showCseResults('YouTube: ' + q, 'site:youtube.com ' + q); };
  srv('searchYouTubeFromServer', [q, ''], function (res) {
    if (!res || !res.ok || !res.items || !res.items.length) { fallback(); return; }
    YS.next = res.next || '';
    showSearchPanel('YouTube: ' + q, '<div class="ytg" id="yt-res">' + res.items.map(ytCardLarge).join('') + '</div><div id="yt-more">' + (YS.next ? moreBtn('ytMore()') : '') + '</div>');
  });
}
function ytMore() {
  if (!YS.next) return;
  var tok = YS.next, q = YS.q; YS.next = '';

  srv('searchYouTubeFromServer', [q, tok], function (res) {

}

/* --- チャンネルページ: 動画 / ショート / 検索 --- */
var CP = { id: '', tab: 'v', pool: [], vNext: '', auto: 0, loading: false, sQ: '', sItems: [], sNext: '' };
function openChannel(id) {
  if (!id) return; stopMain();

  srv('getChannelPage', [id], function (r) {
    if (CP.id !== id) return;
    if (!r || !r.ok) { showApp(tabs('') + '<div class="pg sr-msg">取得できません: ' + errMsg(r) + '</div>'); return; }
    var c = r.channel; CH[c.id] = c; CP.pool = r.items || []; CP.vNext = r.next || '';
    showApp(tabs('') + '<div class="pg"><div class="ban" style="' + (c.banner ? "background-image:url('" + E(c.banner) + "')" : '') + '"></div>' +
      '<div class="chh"><img src="' + E(c.thumb) + '" alt=""><div style="flex:1;min-width:200px"><h2 style="margin:0">' + E(c.title) + '</h2>' +
      '<div class="vm">' + E(c.handle) + ' ・ 登録者 ' + fmtN(c.subs) + ' ・ 動画 ' + fmtN(c.videoCount) + '本</div>' +
      '<div class="vm" style="margin:6px 0;max-height:3.2em;overflow:hidden">' + E(c.desc) + '</div>' + subBtn(c.id) + '</div></div>' +
      '<div class="ctabs"><div class="ctab on" id="ct-v" onclick="chTab(\'v\')">動画</div><div class="ctab" id="ct-s" onclick="chTab(\'s\')">ショート</div><div class="ctab" id="ct-q" onclick="chTab(\'q\')">検索</div></div>' +
      '<div id="ch-body"></div></div>');

}
function chTab(t) {
  CP.tab = t;
  ['v', 's', 'q'].forEach(function (k) { var e = document.getElementById('ct-' + k); if (e) e.classList.toggle('on', k === t); });
  chRender();
}
function isShortV(v) { return !!(v && v.isShort === true); }
function chRender() {
  var b = document.getElementById('ch-body'); if (!b) return;
  if (CP.tab === 'q') {
    b.innerHTML = '<div class="wbar"><input id="cq-in" placeholder="このチャンネル内を検索" value="' + E(CP.sQ) + '" style="flex:1 1 240px;padding:10px 16px;border-radius:99px;border:1px solid var(--accent);background:var(--field-bg); color:var(--field-fg)" onkeydown="if(event.key===\'Enter\')chSearch()">' +
      '<button class="sm on" onclick="chSearch()">検索</button></div><div id="cq-res">' + qHtml() + '</div>';
    return;
  }
  var isS = CP.tab === 's';
  var list = CP.pool.filter(function (v) { return isS ? isShortV(v) : !isShortV(v); });
  if (isS && list.length < 8 && CP.vNext && CP.auto < 4 && !CP.loading) { CP.auto++; chMore(); }
  var h;
  if (list.length) h = '<div class="' + (isS ? 'shg' : 'ytg') + '">' + list.map(isS ? shCard : ytCardLarge).join('') + '</div>';
  else h = '<div class="sr-msg">' + ((CP.loading || (isS && CP.vNext)) ? '読み込み中...' : (isS ? 'ショート動画がありません' : '動画がありません')) + '</div>';
  if (CP.vNext) h += moreBtn('chMore()');
  b.innerHTML = h;
}
function chMore() {
  if (CP.loading || !CP.vNext) return;
  var id = CP.id, tok = CP.vNext; CP.loading = true;
  srv('getChannelVideos', [id, tok], function (r) {
    if (CP.id !== id) return;
    CP.loading = false;
    if (r && r.ok) { CP.pool = CP.pool.concat(r.items || []); CP.vNext = r.next || ''; } else { CP.vNext = ''; }
    if (CP.tab !== 'q') chRender();
  });
