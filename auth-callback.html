function qHtml() {
  if (!CP.sItems.length) return CP.sQ ? '<div class="sr-msg">見つかりませんでした</div>' : '';
  return '<div class="ytg">' + CP.sItems.map(ytCardLarge).join('') + '</div>' + (CP.sNext ? moreBtn('chSearchMore()') : '');
}
function chSearch() {
  var q = document.getElementById('cq-in').value.trim(); if (!q) return;
  CP.sQ = q; CP.sItems = []; CP.sNext = '';
  var box = document.getElementById('cq-res'); box.innerHTML = '<div class="sr-msg">検索中...</div>';
  var id = CP.id;
  srv('searchInChannel', [id, q, ''], function (r) {
    if (CP.id !== id || CP.tab !== 'q') return;
    if (!r || !r.ok) { box.innerHTML = '<div class="sr-msg">' + errMsg(r) + '</div>'; return; }
    CP.sItems = r.items || []; CP.sNext = r.next || ''; box.innerHTML = qHtml();
  });
}
function chSearchMore() {
  if (!CP.sNext) return;
  var id = CP.id, q = CP.sQ, tok = CP.sNext; CP.sNext = '';
  srv('searchInChannel', [id, q, tok], function (r) {
    if (CP.id !== id || CP.tab !== 'q') return;
    if (r && r.ok) { CP.sItems = CP.sItems.concat(r.items || []); CP.sNext = r.next || ''; }
    var box = document.getElementById('cq-res'); if (box) box.innerHTML = qHtml();
  });
}

/* --- ループボタン(リスト全体のループ)の状態表示 --- */
var _unp = updateNowPlaying;
updateNowPlaying = function () {
  _unp();
  var b = document.getElementById('loop-btn');
  if (b) {
    b.style.background = cfg.autoLoop ? 'var(--accent)' : 'var(--btn-bg)';
    b.style.color = cfg.autoLoop ? 'var(--on-accent)' : 'var(--btn-fg)';
    b.title = cfg.autoLoop ? 'リスト全体をループ中(押すと解除)' : 'リスト全体をループ再生する';
  }
  var info = document.getElementById('queue-info');
  if (info && queue && info.textContent) {
    if (queue.order.length === 1) info.textContent += '  (このリストのYouTube動画は1本だけです)';
    if (cfg.autoLoop) info.textContent += '  🔁';
  }
};
updateNowPlaying();
</script>

<script>
/* ===== PART E: おすすめからショート除外 / ショート表示 / ライブ / 並び替え / 通知 ===== */
function gid(i) { return document.getElementById(i); }

/* --- カード(ライブ表示つき) --- */
function ytCardLarge(v) {
  var badge = v.lb === 'live' ? '<span class="dur" style="background:#e00">● LIVE</span>' :
              v.lb === 'upcoming' ? '<span class="dur" style="background:#555">配信予定</span>' :
              (v.durText ? '<span class="dur">' + E(v.durText) + '</span>' : '');
  return '<div class="ytc" onclick="openWatch(\'' + E(v.id) + '\')"><div class="ytc-th"><img loading="lazy" src="' + E(v.thumbHi || v.thumb) + '" alt="">' + badge + '</div>' +
         '<div class="ytc-t">' + E(v.title) + '</div>' +
         '<div class="ytc-m"><a onclick="event.stopPropagation();openChannel(\'' + E(v.channelId) + '\')">' + E(v.channel) + '</a></div>' +
         '<div class="ytc-m">' + metaLine(v) + '</div></div>';
}
function shCard(v) {   // ショートはショート表示(縦スクロール)で開く
  return '<div class="shc" onclick="shortsFrom(\'' + E(v.id) + '\')"><div class="shc-th"><img loading="lazy" src="' + E(v.thumbHi || v.thumb) + '" alt=""></div>' +
         '<div class="ytc-t">' + E(v.title) + '</div><div class="ytc-m">' + (v.views != null ? E(fmtN(v.views)) + ' 回視聴' : '') + '</div></div>';
}

/* --- チャンネルページ: 動画 / ショート / ライブ / 検索 + 並び替え --- */
function addPool(items) {
  var seen = {}; CP.pool.forEach(function (v) { seen[v.id] = 1; });
  (items || []).forEach(function (v) { if (!seen[v.id]) { seen[v.id] = 1; CP.pool.push(v); } });
}
function chList(tab) {
  var t = tab || CP.tab;
  var l = CP.pool.filter(function (v) {
    if (t === 's') return isShortV(v);
    if (t === 'l') return !!v.isLive;
    return !isShortV(v) && !v.isLive;
  });
  var rank = function (v) { return v.lb === 'live' ? 0 : v.lb === 'upcoming' ? 1 : 2; };
  l.sort(function (a, b) {
    if (CP.sort === 'old') return (a.published || '') < (b.published || '') ? -1 : 1;
    if (CP.sort === 'pop') return (b.views == null ? -1 : b.views) - (a.views == null ? -1 : a.views);
    if (t === 'l' && rank(a) !== rank(b)) return rank(a) - rank(b);
    return (a.published || '') < (b.published || '') ? 1 : -1;
  });
  return l;
}
function openChannel(id) {
  if (!id) return; stopMain();
  CP = { id: id, tab: 'v', pool: [], vNext: '', auto: 0, loading: false, sQ: '', sItems: [], sNext: '', sort: 'new', all: false, loadingAll: false };
  showApp(tabs('') + '<div class="pg"><div class="sr-msg">読み込み中...</div></div>');
  srv('getChannelPage', [id], function (r) {
    if (CP.id !== id) return;
    if (!r || !r.ok) { showApp(tabs('') + '<div class="pg sr-msg">取得できません: ' + errMsg(r) + '</div>'); return; }
    var c = r.channel; CH[c.id] = c; CP.pool = r.items || []; CP.vNext = r.next || '';
    showApp(tabs('') + '<div class="pg"><div class="ban" style="' + (c.banner ? "background-image:url('" + E(c.banner) + "')" : '') + '"></div>' +
      '<div class="chh"><img src="' + E(c.thumb) + '" alt=""><div style="flex:1;min-width:200px"><h2 style="margin:0">' + E(c.title) + '</h2>' +
      '<div class="vm">' + E(c.handle) + ' ・ 登録者 ' + fmtN(c.subs) + ' ・ 動画 ' + fmtN(c.videoCount) + '本</div>' +
      '<div class="vm" style="margin:6px 0;max-height:3.2em;overflow:hidden">' + E(c.desc) + '</div>' + subBtn(c.id) + ' ' + ntfBtn(c.id) + ' ' + pinBtn(c.id) + ' ' + blkBtn(c.id, c.title) + '</div></div>' +
      '<div class="ctabs"><div class="ctab on" id="ct-v" onclick="chTab(\'v\')">動画</div><div class="ctab" id="ct-s" onclick="chTab(\'s\')">ショート</div>' +
      '<div class="ctab" id="ct-l" onclick="chTab(\'l\')">ライブ</div><div class="ctab" id="ct-p" onclick="chTab(\'p\')">再生リスト</div><div class="ctab" id="ct-q" onclick="chTab(\'q\')">検索</div><div class="sp"></div>' +
      '<select id="ch-sort" onchange="chSort(this.value)"><option value="new">新しい順</option><option value="old">古い順</option><option value="pop">人気順</option></select></div>' +
      '<div id="ch-body"></div></div>');
    chRender();
  });
}
function chTab(t) {
  CP.tab = t;
  ['v', 's', 'l', 'p', 'q'].forEach(function (k) { var e = gid('ct-' + k); if (e) e.classList.toggle('on', k === t); });
  chRender();
}
function chSort(v) { CP.sort = v; chRender(); }
function chRender() {
  var b = gid('ch-body'); if (!b) return;
  var ss = gid('ch-sort'); if (ss) ss.style.display = (CP.tab === 'q' || CP.tab === 'p') ? 'none' : ''; if (CP.tab === 'p') { chPlRender(); return; }
  if (CP.tab === 'q') {
    b.innerHTML = '<div class="wbar"><input id="cq-in" placeholder="このチャンネル内を検索" value="' + E(CP.sQ) + '" style="flex:1 1 240px;padding:10px 16px;border-radius:99px;border:1px solid var(--accent);background:var(--field-bg); color:var(--field-fg)" onkeydown="if(event.key===\'Enter\')chSearch()">' +
      '<button class="sm on" onclick="chSearch()">検索</button></div><div id="cq-res">' + qHtml() + '</div>';
    return;
  }
  var t = CP.tab, needAll = CP.sort !== 'new';
  if (needAll && !CP.all) {   // 古い順・人気順は全件を読み込んでから並べ替える
    b.innerHTML = '<div class="sr-msg" id="ch-prog">全件を読み込んで並び替えています… ' + CP.pool.length + '件</div>';
    chLoadAll();   // 表示を先に書く(読み込み済みなら chLoadAll が即座に一覧を描画する)
    return;
  }
  var list = chList();
  if (!needAll && list.length < 8 && CP.vNext && CP.auto < 4 && !CP.loading) { CP.auto++; chMore(); }
  var h;
  if (list.length) h = '<div class="' + (t === 's' ? 'shg' : 'ytg') + '">' + list.map(t === 's' ? shCard : ytCardLarge).join('') + '</div>';
  else h = '<div class="sr-msg">' + ((CP.loading || CP.vNext) && !needAll ? '読み込み中...' : (t === 's' ? 'ショート動画がありません' : t === 'l' ? 'ライブ配信がありません' : '動画がありません')) + '</div>';
  if (!needAll && CP.vNext) h += moreBtn('chMore()');
  if (needAll && CP.vNext) h += '<div class="vm" style="text-align:center;margin:12px">※ 新しい3000件までを対象にしています</div>';
  b.innerHTML = h;
}
function chMore() {
  if (CP.loading || CP.loadingAll || !CP.vNext) return;
  var id = CP.id, tok = CP.vNext; CP.loading = true;
  srv('getChannelVideos', [id, tok], function (r) {
    if (CP.id !== id) return;
    CP.loading = false;
    if (r && r.ok) { addPool(r.items); CP.vNext = r.next || ''; } else { CP.vNext = ''; }
    if (CP.tab !== 'q') chRender();
  });
}
function chLoadAll() {
  if (CP.all || CP.loadingAll) return;
  CP.loadingAll = true; var id = CP.id;
  (function step() {
    if (CP.id !== id) return;
    if (CP.loading) { setTimeout(step, 300); return; }
    if (!CP.vNext || CP.pool.length >= 3000) { CP.loadingAll = false; CP.all = true; if (CP.tab !== 'q') chRender(); return; }
    var tok = CP.vNext;
    srv('getChannelVideos', [id, tok], function (r) {
      if (CP.id !== id) return;
      if (r && r.ok) { addPool(r.items); CP.vNext = r.next || ''; } else { CP.vNext = ''; }
      var pg = gid('ch-prog'); if (pg) pg.textContent = '全件を読み込んで並び替えています… ' + CP.pool.length + '件';
      step();
    });
  })();
}

/* --- チャンネルのショート → ショート表示(縦スクロール) --- */
function shMakeObserver(feed) {
  SH.io = new IntersectionObserver(function (es) {
    es.forEach(function (en) {
      var el = en.target, f = el.querySelector('.sf');
      if (en.isIntersecting) {
        if (!f.firstChild) f.innerHTML = '<iframe allow="autoplay; encrypted-media; fullscreen" allowfullscreen src="https://www.youtube-nocookie.com/embed/' + el.dataset.id + '?autoplay=1&loop=1&playlist=' + el.dataset.id + '&rel=0&playsinline=1"></iframe>';
        if (+el.dataset.i >= SH.n - 3) loadShorts();
      } else f.innerHTML = '';
    });
  }, { root: feed, threshold: 0.6 });
}
function shAppend(items) {
  var feed = gid('sh-feed'); if (!feed) return;
  pfFilter(items || []).forEach(function (v) {
    if (SH.seen[v.id]) return; SH.seen[v.id] = 1;
    var d = document.createElement('div'); d.className = 'sh'; d.dataset.id = v.id; d.dataset.i = SH.n++;
    d.innerHTML = '<div class="sf"></div><div class="vm" style="max-width:90%;text-align:center"><b>' + E(v.title) + '</b> ・ <a style="cursor:pointer" onclick="openChannel(\'' + E(v.channelId) + '\')">' + E(v.channel) + '</a> ・ <a style="cursor:pointer" onclick="addVidToList(\'' + E(v.id) + '\')">＋リスト</a></div>';
    (window.__vt = window.__vt || {})[v.id] = v.title;
    feed.appendChild(d); SH.io.observe(d);
  });
}
function shortsFrom(vid) {
  var list = chList('s'), idx = 0;
  for (var i = 0; i < list.length; i++) { if (list[i].id === vid) { idx = i; break; } }
  stopMainForce();
  SH = { tok: {}, seen: {}, busy: false, io: null, n: 0, mode: 'list', cid: CP.id, next: CP.all ? '' : CP.vNext };
  showApp(tabs('s') + '<div id="sh-feed"></div><div class="sh-nav"><button title="前 (↑)" onclick="shStep(-1)">▲</button><button title="次 (↓)" onclick="shStep(1)">▼</button></div>', true);
  var feed = gid('sh-feed'); shMakeObserver(feed); shAppend(list);
  setTimeout(function () { feed.scrollTop = idx * feed.clientHeight; }, 60);
}
var _loadShorts = loadShorts;
loadShorts = function () {
  if (!SH || SH.mode !== 'list') return _loadShorts();
  if (SH.busy || !SH.next) return;
  SH.busy = true; var tok = SH.next, cid = SH.cid;
  srv('getChannelVideos', [cid, tok], function (r) {
    SH.busy = false;
    if (!gid('sh-feed') || SH.cid !== cid) return;
    if (r && r.ok) {
      SH.next = r.next || '';
      if (CP.id === cid) { addPool(r.items); CP.vNext = SH.next; }
      var sh = (r.items || []).filter(isShortV);
      shAppend(sh);
      if (!sh.length && SH.next) loadShorts();
    } else { SH.next = ''; }
  });
};

/* --- 登録チャンネルの新着通知 --- */
function ntfGet() { try { return JSON.parse(localStorage.getItem('ws_ntf') || '{}'); } catch (e) { return {}; } }
function ntfSet(o) { try { localStorage.setItem('ws_ntf', JSON.stringify(o)); } catch (e) {} }
function nowIso() { return new Date().toISOString().replace(/\.\d+Z$/, 'Z'); }
function ntfOn(id) { return (ntfGet().ids || []).indexOf(id) >= 0; }
function ntfBtn(id) {
  var on = ntfOn(id);
  return '<button class="sm ntfbtn' + (on ? ' on' : '') + '" data-id="' + E(id) + '" onclick="toggleNotify(\'' + E(id) + '\')">' + (on ? '🔔 通知ON' : '🔕 通知OFF') + '</button>';
}
function ntfSync() { srv('saveNotifyChannels', [(ntfGet().ids || []).join(',')], function () {}); }
function ntfAskPermission() { try { if (window.Notification && Notification.permission === 'default') Notification.requestPermission(); } catch (e) {} }
function toggleNotify(id) {
  var o = ntfGet(); o.ids = o.ids || []; o.since = o.since || {};
  var i = o.ids.indexOf(id);
  if (i >= 0) { o.ids.splice(i, 1); delete o.since[id]; }
  else {
    if (o.ids.length >= 20) { alert('通知できるチャンネルは20件までです'); return; }
    o.ids.push(id); o.since[id] = nowIso(); ntfAskPermission();
  }
  ntfSet(o); ntfSync();
  document.querySelectorAll('.ntfbtn[data-id="' + id + '"]').forEach(function (b) { b.outerHTML = ntfBtn(id); });
  ntfStart();
}
function ntfAll(on) {
  var o = ntfGet(); o.since = o.since || {};
  o.ids = on ? savedChannels().slice(0, 20).map(function (c) { return c.id; }) : [];
  var keep = {}; o.ids.forEach(function (id) { keep[id] = o.since[id] || nowIso(); }); o.since = keep;
  if (on) ntfAskPermission();
  ntfSet(o); ntfSync(); showChannels(); ntfStart();
}
function ntfKind(v) {
  return v.lb === 'live' ? '🔴 ライブ配信中' : v.lb === 'upcoming' ? '🗓 ライブ予定' : v.isLive ? '📼 配信アーカイブ' : isShortV(v) ? '⚡ ショート' : '🎬 動画';
}
function ntfToast(v, kind) {
  var d = document.createElement('div'); d.className = 'ntf-toast';
  d.innerHTML = '🔔 <b>' + E(v.channel) + '</b> ' + E(kind) + '<br>' + E(v.title);
  d.onclick = function () { if (d.parentNode) d.parentNode.removeChild(d); openWatch(v.id); };
  document.body.appendChild(d);
  setTimeout(function () { if (d.parentNode) d.parentNode.removeChild(d); }, 12000);
}
function ntfBadge() {
  var n = (ntfGet().log || []).filter(function (x) { return !x.read; }).length, d = gid('notif-dot');
  if (d) { d.textContent = n > 9 ? '9+' : String(n); d.classList.toggle('on', n > 0); }
}
var NTF = { timer: null, busy: false };
function ntfStart() {
  if (NTF.timer) return;
  var o = ntfGet(); if (!(o.ids && o.ids.length)) return;
  NTF.timer = setInterval(function () { ntfCheck(false); }, pfNtfMs());
  setTimeout(function () { ntfCheck(false); }, 4000);
}
function ntfCheck(manual) {
  var o = ntfGet();
  if (!(o.ids && o.ids.length) || NTF.busy) { var s0 = gid('ntf-status'); if (manual && s0) s0.textContent = '通知するチャンネルが選ばれていません'; return; }
  NTF.busy = true;
  var st = gid('ntf-status'); if (manual && st) st.textContent = '確認中…';
  srv('checkNotify', [o.ids.join(',')], function (r) {
    NTF.busy = false;
    var st2 = gid('ntf-status');
    if (!r || !r.ok) { if (st2) st2.textContent = '確認できませんでした: ' + errMsg(r); return; }
    var o2 = ntfGet(); o2.log = o2.log || []; o2.since = o2.since || {};
    var fresh = [], maxPub = {};
    (r.items || []).forEach(function (v) {
      var s = o2.since[v.channelId]; if (!s) return;
      if (!maxPub[v.channelId] || v.published > maxPub[v.channelId]) maxPub[v.channelId] = v.published;
      var dup = o2.log.some(function (x) { return x.id === v.id; });
      if (v.published > s && !dup) fresh.push(v);
    });
    Object.keys(maxPub).forEach(function (cid) { if (maxPub[cid] > o2.since[cid]) o2.since[cid] = maxPub[cid]; });
    fresh.sort(function (a, b) { return a.published < b.published ? -1 : 1; });
    fresh.filter(pfNtfKindOk).forEach(function (v) {
      var kind = ntfKind(v);
      o2.log.unshift({ id: v.id, title: v.title, channel: v.channel, channelId: v.channelId, thumb: v.thumb, kind: kind, published: v.published, read: false });
      ntfToast(v, kind);
      try { if (window.Notification && Notification.permission === 'granted' && !pfQuiet()) new Notification(v.channel + ' ' + kind, { body: v.title }); } catch (e) {}
    });
    o2.log = o2.log.slice(0, 50); ntfSet(o2); ntfBadge();
    if (st2) st2.textContent = '確認しました(新着 ' + fresh.length + ' 件)';
  });
}
function ntfClear() { var o = ntfGet(); o.log = []; ntfSet(o); ntfBadge(); showNotifs(); }
function ntfMail(on) {
  srv('setNotifyMail', [!!on], function (r) {
    var cb = gid('ntf-mail');
    if (!r || !r.ok) {
      if (cb) cb.checked = !on;
      alert('メール通知を切り替えられませんでした。\nApps Scriptエディタで関数 setupNotifyTrigger を1回実行(権限の承認)してから、もう一度お試しください。\n(' + String((r && r.reason) || '').slice(0, 100) + ')');
      return;
    }
    var o = ntfGet(); o.mail = !!on; ntfSet(o);
  });
}
function showNotifs() {
  var o = ntfGet(), log = o.log || [], ids = o.ids || [];
  var h = tabs('n') + '<div class="pg"><div class="wbar"><button class="sm on" onclick="ntfCheck(true)">🔄 今すぐ確認</button><button class="sm" onclick="ntfClear()">履歴を消す</button>' +
    '<label class="sm" style="display:inline-flex;gap:6px;align-items:center;cursor:pointer"><input type="checkbox" id="ntf-mail"' + (o.mail ? ' checked' : '') + ' onchange="ntfMail(this.checked)"> 📧 メールでも通知(1時間ごと・アプリを閉じていても届く)</label></div>' +
    '<div class="vm" id="ntf-status" style="margin:6px 0">通知中のチャンネル: ' + ids.length + '件 ／ アプリを開いている間は' + pfNtfMin() + '分ごとに確認します(登録チャンネル画面の🔔で選べます)</div><h3>🔔 新着の通知</h3>';
  if (log.length) {
    log.forEach(function (x) {
      h += '<div class="rc" onclick="openWatch(\'' + E(x.id) + '\')"><img src="' + E(x.thumb) + '" alt=""><div><div class="vt">' + (x.read ? '' : '🆕 ') + E(x.title) + '</div><div class="vm">' + E(x.channel) + ' ・ ' + E(x.kind) + ' ・ ' + E(ago(x.published)) + '</div></div></div>';
    });
  } else {
    h += '<div class="sr-msg">まだ通知はありません。登録チャンネルの「🔔」で、通知するチャンネルを選べます。</div>';
  }
  showApp(h + '</div>');
  log.forEach(function (x) { x.read = true; }); o.log = log; ntfSet(o); ntfBadge();
}

/* --- 登録チャンネルページ(通知ボタンつき) --- */
function showChannels() {
  var subs = savedChannels();
  var h = tabs('c') + '<div class="pg"><h3 style="margin-top:4px">🔎 チャンネルを探して登録</h3><div class="wbar">' +
       '<input id="ch-q" placeholder="チャンネル名" style="flex:1 1 220px;padding:10px 16px;border-radius:99px;border:1px solid var(--accent);background:var(--field-bg); color:var(--field-fg)" onkeydown="if(event.key===\'Enter\')searchCh()">' +
       '<button class="sm on" onclick="searchCh()">検索</button></div><div id="ch-res" class="grid ch-grid"></div>' +
       '<h3>📺 登録チャンネル (' + subs.length + ')</h3><div class="wbar"><span class="vm">🔔 を押したチャンネルの新着(動画・ショート・ライブ)を通知します</span>' +
       '<button class="sm" onclick="ntfAll(true)">全て通知ON</button><button class="sm" onclick="ntfAll(false)">全て通知OFF</button></div><div class="grid ch-grid">';
  if (subs.length) {
    subs.forEach(function (c) {
      h += chCard(c, '<button class="sm" onclick="openChannel(\'' + E(c.id) + '\')">開く</button><button class="sm" onclick="unsubFromPage(\'' + E(c.id) + '\')">解除</button>' + ntfBtn(c.id) + pinBtn(c.id));
    });
  } else {
    h += '<div class="sr-msg">まだありません。上の検索、または視聴ページの「チャンネル仮登録」から追加できます。</div>';
  }
  h += '</div><h3>🆕 登録チャンネルの新着</h3><div id="ch-new" class="grid"><div class="sr-msg">読み込み中...</div></div></div>';
  showApp(h);
  if (!subs.length) { gid('ch-new').innerHTML = ''; return; }
  srv('getRecommendationsForChannels', [subsSpec(8, 18)], function (r) {

/* --- データ: 書き出し/読み込み/クラウド/プロファイル/初期化 --- */
var PF_LS = ['ws_channels', 'ws_ntf', 'ws_genre', 'ws_watch', 'ws_last'];
function pfExportObj() {
  var ls = {}; PF_LS.forEach(function (k) { var v = localStorage.getItem(k); if (v != null) ls[k] = v; });
  return { app: 'ws-viewer', v: 1, pf: JSON.parse(JSON.stringify(PF)), cfg: cfg, ls: ls };
}
function pfImportObj(o) {
  if (!o || o.app !== 'ws-viewer') throw new Error('形式が違います');
  if (o.pf) { PF = pfMerge(PF_DEF, o.pf); Object.keys(PF_SECTIONS).forEach(function (k) { if (PF.home.order.indexOf(k) < 0) PF.home.order.push(k); }); pfSave(); }
  if (o.cfg && typeof o.cfg === 'object') { Object.keys(o.cfg).forEach(function (k) { var t = typeof o.cfg[k]; if (t === 'string' || t === 'number' || t === 'boolean') cfg[k] = o.cfg[k]; }); cfgSave(); }
  if (o.ls) PF_LS.forEach(function (k) { if (typeof o.ls[k] === 'string') localStorage.setItem(k, o.ls[k]); });
  apply(); pfApply(); pfSeenRefresh(); ntfBadge(); ntfRestart(); updateNowPlaying();

}
function pfExportShow() { var t = gid('pf-export'); if (t) t.value = JSON.stringify(pfExportObj()); }
function pfCopy() {

}
function pfCloudSave() {
  var m = gid('pf-cloud-msg'), j = JSON.stringify(pfExportObj());

  srv('savePrefs', [j], function (r) { if (m) m.textContent = r && r.ok ? '保存しました(' + Math.round(r.size / 1024 * 10) / 10 + 'KB)' : '保存できませんでした: ' + String((r && r.reason) || ''); });
}
function pfCloudLoad() {
  var m = gid('pf-cloud-msg'); if (m) m.textContent = '読み込み中…';
  srv('loadPrefs', [], function (r) {
    if (!(r && r.ok)) { if (m) m.textContent = r && r.reason === 'NONE' ? '保存されたデータがありません' : '復元できませんでした'; return; }
    try { pfImportObj(JSON.parse(r.json)); showCustomize('data'); miniToast('クラウドから復元しました'); } catch (e) { if (m) m.textContent = '復元できませんでした: ' + e.message; }

function pfProfileSave() {

function pfProfileApply(i) {

  pfSave(); pfApply(); ntfRestart(); pfRefresh(); miniToast('「' + n + '」を適用しました');
}
function pfProfileDel(i) { delete PF.profiles[Object.keys(PF.profiles)[i]]; pfSave(); pfRefresh(); }
function pfReset() {

  var keep = PF.profiles; PF = pfMerge(PF_DEF, null); PF.profiles = keep; pfSave(); pfApply(); ntfRestart(); showCustomize();
}

pfSeenRefresh(); pfApply(); sleepBadge(); updateNowPlaying(); ntfBadge(); ntfStart();
</script>

<script>
/* ===== PART I: ブックマークの階層(ジャンル/リスト) とリスト保存ダイアログ ===== */
/* 保存形式は従来どおり「ジャンル/リスト/動画名 | URL」。/ で区切った分だけ階層になる。 */
function qLabel(f) {
  if (!f) return 'ルート';
  return String(f).indexOf('@all:') === 0 ? (String(f).slice(5) || 'すべて') + '(すべて)' : f;
}
function jp(p) { return "decodeURIComponent('" + encodeURIComponent(p).replace(/'/g, '%27') + "')"; }   // onclick に安全に埋め込む
function bmNodes() {
  var nodes = { '': { path: '', name: '', depth: 0, children: [], items: folderItems[''] || [] } };
  Object.keys(folderItems).forEach(function (f) {
    if (f === '') return;
    var cur = '';
    f.split('/').forEach(function (p, i) {
      var np = cur ? cur + '/' + p : p;
      if (!nodes[np]) { nodes[np] = { path: np, name: p, depth: i + 1, children: [], items: folderItems[np] || [] }; nodes[cur].children.push(np); }
      cur = np;
    });
  });
  Object.keys(nodes).forEach(function (k) {
    nodes[k].children.sort(function (a, b) { return nodes[a].name.localeCompare(nodes[b].name, 'ja'); });   // 従来のサイドバーと同じ五十音/アルファベット順
  });
  return nodes;
}
function bmAllUnder(path, nodes) {   // そのフォルダ直下 → 子リストの順に、すべての項目を返す

/* ===== PART J: アクセントカラーの見やすさを自動調整 ===== */
function pfLum(hex) {
  var c = [1, 3, 5].map(function (i) { var v = parseInt(hex.substr(i, 2), 16) / 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
  return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
}
function pfRatio(a, b) { var x = pfLum(a), y = pfLum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); }
function pfMix(a, b, t) {
  var o = '#'; for (var i = 1; i < 7; i += 2) { var v = Math.round(parseInt(a.substr(i, 2), 16) * (1 - t) + parseInt(b.substr(i, 2), 16) * t); o += ('0' + v.toString(16)).slice(-2); }
  return o;
}
function pfContrast() {   // 見出し・時計などの「アクセント色の文字」と、アクセント色の上に載せる文字色を決める
  var s = document.documentElement.style, acc = String(cfg.accent || '');
  if (!/^#[0-9a-f]{6}$/i.test(acc)) { s.removeProperty('--accent-fg'); s.removeProperty('--on-accent'); return; }
  var light = cfg.mode === 'light', bg = light ? '#f8f9fa' : '#020202', to = light ? '#000000' : '#ffffff', fg = acc;
  [0.25, 0.4, 0.55, 0.7, 0.85].forEach(function (t) { if (pfRatio(fg, bg) < 3.5) fg = pfMix(acc, to, t); });   // 背景と十分な差が出るまで文字側へ寄せる
  s.setProperty('--accent-fg', pfRatio(acc, bg) >= 3.5 ? acc : fg);
  s.setProperty('--on-accent', pfRatio(acc, '#000000') >= pfRatio(acc, '#ffffff') ? '#000000' : '#ffffff');
}
var _applyJ = apply;
apply = function () { _applyJ(); pfContrast(); };
pfContrast();

<script>
/* ===== PART M: ライブラリ強化(リストの移動/名前変更・まとめて操作・取り込み・書き出し・検索・並び順・削除の取り消し) ===== */
pfExtend({ room: { view: 'grid', sort: {}, confirmDelete: true } });
function bmLast(p) { var a = String(p).split('/'); return a[a.length - 1]; }
function bmParent(p) { var a = String(p).split('/'); a.pop(); return a.join('/'); }
function bmJoin(a, b) { return a ? a + '/' + b : b; }
function bmUrlOf(b) { var v = getVideoId(b.url); return v ? 'https://www.youtube.com/watch?v=' + v : b.url; }
function bmContentOf(id) {
  var out = null;
  Object.keys(folderItems).forEach(function (f) { folderItems[f].forEach(function (b) { if (String(b.id) === String(id)) out = (f ? f + '/' : '') + b.name + ' | ' + b.url; }); });
  return out;
}
function bmEntries(path, nodes) {   // 配下のすべての項目を、リスト名つきで返す
  nodes = nodes || bmNodes();
  var out = [], n = nodes[path || '']; if (!n) return out;
  n.items.forEach(function (b) { out.push({ folder: path || '', b: b }); });
  n.children.forEach(function (c) { bmEntries(c, nodes).forEach(function (x) { out.push(x); }); });
  return out;
}

/* --- 取り消しつきのお知らせ --- */
function undoToast(msg, fn) {
  var d = document.createElement('div'); d.className = 'ntf-toast'; d.style.cssText += ';display:flex;gap:10px;align-items:center';
  var s = document.createElement('span'); s.textContent = msg; var b = document.createElement('button'); b.className = 'sm on'; b.textContent = '元に戻す';
  b.onclick = function () { if (d.parentNode) d.parentNode.removeChild(d); fn(); };
  d.appendChild(s); d.appendChild(b); document.body.appendChild(d);
  setTimeout(function () { if (d.parentNode) d.parentNode.removeChild(d); }, 10000);
}

/* --- リストの移動・名前変更(中のリストや動画もまとめて) --- */
function folderMovePick(path) {
  openListPicker({ pathOnly: true, exclude: path, title: '「' + bmLast(path) + '」の移動先を選ぶ', defaultPath: bmParent(path),
    onPick: function (dest) { folderMoveTo(path, bmJoin(dest, bmLast(path))); } });
}
function folderRenamePrompt(path) {
  var n = lpCleanName(prompt('新しいリスト名', bmLast(path)) || ''); if (!n) return;
  folderMoveTo(path, bmJoin(bmParent(path), n));
}
function folderMoveTo(oldP, newP) {
  newP = lpCleanPath(newP);
  if (!oldP || newP === oldP) return;
  if (newP.indexOf(oldP + '/') === 0) { alert('自分の中には移動できません'); return; }
  var nodes = bmNodes(), cnt = bmAllUnder(oldP, nodes).length, sub = nodes[oldP] ? nodes[oldP].children.length : 0;
  var exists = nodes[newP] && (nodes[newP].items.length || nodes[newP].children.length);
  var msg = '「' + oldP + '」(' + cnt + '件' + (sub ? '・' + sub + 'リスト' : '') + ')を\n「' + newP + '」へ移動します。\n中のリストと動画もすべて一緒に移動します。' + (exists ? '\n※ 同じ名前のリストがあるため、中身が統合されます。' : '') + '\nよろしいですか?';
  if (!confirm(msg)) return;
  srv('renameBookmarkFolder', [oldP, newP], function (r) {
    if (!(r && r.ok)) { alert('移動できませんでした: ' + (r && r.reason === 'INTO_ITSELF' ? '自分の中には移動できません' : String((r && r.reason) || ''))); return; }
    miniToast('「' + newP + '」へ移動しました(' + r.changed + '件)');
    refreshBookmarks(); setTimeout(function () { showFolderP(newP); }, 900);
  });
}
function folderBtns(cp) {
  return isEditMode ? '<div class="eb"><button class="sm" onclick="event.stopPropagation();folderMovePick(' + jp(cp) + ')">📂 移動</button><button class="sm" onclick="event.stopPropagation();folderRenamePrompt(' + jp(cp) + ')">✏ 名前</button></div>' : '';
}
function mToolbar() {
  var s = '';
  if (ROOM.path) s += '<button class="sm" onclick="folderMovePick(' + jp(ROOM.path) + ')">📂 別のリストへ移動</button><button class="sm" onclick="folderRenamePrompt(' + jp(ROOM.path) + ')">✏ 名前変更</button>';
  return s + '<button class="sm" onclick="roomImport()">📥 取り込み</button><button class="sm" onclick="roomExport()">📋 書き出し</button>';
}

/* --- 検索 / 並び順 / 表示切替 --- */
function mSearchBar() { return '<div class="wbar rm-keep" id="rm-search"><input type="text" id="rm-q" placeholder="🔎 ブックマークを検索(すべてのリスト)" oninput="roomFilter(this.value)" style="flex:1 1 240px"></div><div id="rm-res" class="rm-keep"></div>'; }
function mSortBar(path) {
  var m = PF.room.sort[path] || 'sheet', hasItems = (folderItems[path] || []).length > 1;
  return '<div class="wbar">' + (hasItems ? '<span class="vm">並び順</span><select onchange="roomSetSort(this.value)">' + pfOpt([['sheet', '追加順'], ['name', '名前順'], ['nameDesc', '名前(逆順)'], ['random', 'ランダム']], m) + '</select>' : '') +
    '<button class="sm" onclick="roomSetView(\'' + (PF.room.view === 'list' ? 'grid' : 'list') + '\')">' + (PF.room.view === 'list' ? '🖼 カード表示' : '📋 リスト表示') + '</button></div>';
}
function roomFilter(q) {
  q = String(q || '').trim().toLowerCase();
  var res = gid('rm-res'); if (!res) return;
  res.parentNode.classList.toggle('rm-searching', !!q);
  if (!q) { res.innerHTML = ''; return; }
  var out = [];
  Object.keys(folderItems).forEach(function (f) { folderItems[f].forEach(function (b) { if (out.length < 80 && (b.name.toLowerCase().indexOf(q) >= 0 || f.toLowerCase().indexOf(q) >= 0)) out.push({ f: f, b: b }); }); });
  res.innerHTML = out.length ? '<h3>🔎 検索結果 (' + out.length + '件)</h3><div class="grid">' + out.map(function (x) { return '<div class="vc" onclick="roomPlay(' + x.b.id + ')">' + thumbOf(x.b) + '<div class="vt">' + E(x.b.name) + '</div><div class="vm">' + E(x.f || 'ルート') + '</div></div>'; }).join('') + '</div>' : '<div class="sr-msg">見つかりません</div>';
}
function roomSortArr(a, m) {
  if (m === 'name') a.sort(function (x, y) { return x.name.localeCompare(y.name, 'ja'); });
  else if (m === 'nameDesc') a.sort(function (x, y) { return y.name.localeCompare(x.name, 'ja'); });
  else if (m === 'random') { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } }
  else a.sort(function (x, y) { return x.id - y.id; });
  return a;
}
function roomSetSort(m) { PF.room.sort[ROOM.path] = m; pfSave(); roomSortArr(folderItems[ROOM.path] || [], m); showFolderP(ROOM.path); }
function roomSetView(v) { PF.room.view = v; pfSave(); showFolderP(ROOM.path); }
function roomSortItems(items) {   // 再読み込み時に、リストごとの並び順を反映(原本のシートは変更しない)
  var groups = {}, order = [];
  (items || []).forEach(function (it) {
    var segs = String(it.content || '').split(' | ')[0].split('/'); segs.pop();
    var f = segs.join('/'); if (!groups[f]) { groups[f] = []; order.push(f); } groups[f].push(it);
  });
  var out = [];
  order.forEach(function (f) {
    var m = PF.room.sort[f] || 'sheet', g = groups[f];
    if (m === 'sheet') { out = out.concat(g); return; }
    var nm = function (it) { var s = String(it.content || '').split(' | ')[0].split('/'); return s[s.length - 1]; };
    if (m === 'name') g = g.slice().sort(function (x, y) { return nm(x).localeCompare(nm(y), 'ja'); });
    else if (m === 'nameDesc') g = g.slice().sort(function (x, y) { return nm(y).localeCompare(nm(x), 'ja'); });
    else if (m === 'random') g = roomSortArr(g.slice().map(function (it) { return { id: Math.random(), name: '', it: it }; }), 'random').map(function (o) { return o.it; });
    out = out.concat(g);
  });
  return out;
}
var _renderTreeM = renderTree;
renderTree = function (items) { _renderTreeM(roomSortItems(items)); };

/* --- まとめて選択(編集モード) --- */
function selBox(id) { return isEditMode ? '<input type="checkbox" class="msel" data-id="' + id + '" onclick="event.stopPropagation();mSelUpdate()" title="選択">' : ''; }
function mSelIds() { return Array.prototype.map.call(document.querySelectorAll('#app-view .msel:checked'), function (c) { return +c.dataset.id; }); }
function mSelUpdate() { var n = gid('rm-bn'); if (n) n.textContent = mSelIds().length; }
function mSelAll(on) { Array.prototype.forEach.call(document.querySelectorAll('#app-view .msel'), function (c) { c.checked = on; }); mSelUpdate(); }

var _showAppM = showApp;
showApp = function () { var r = _showAppM.apply(this, arguments); mBulkSync(); return r; };
var _hideAppM = hideApp;
hideApp = function () { var r = _hideAppM.apply(this, arguments); mBulkSync(); return r; };
function bulkMove() {

    srv('moveBookmarks', [ids, dest], function (r) {

      else alert('移動できませんでした');
    });

}
function bulkDelete() {

  var cs = ids.map(bmContentOf).filter(Boolean);
  if (PF.room.confirmDelete && !confirm(ids.length + '件を削除しますか?(削除直後なら「元に戻す」で復元できます)')) return;
  srv('deleteBookmarks', [ids], function (r) {
    if (!(r && r.ok)) { alert('削除できませんでした'); return; }
    refreshBookmarks();
    undoToast(r.deleted + '件を削除しました', function () { srv('addBookmarksBatch', [cs], function () { refreshBookmarks(); miniToast('元に戻しました(末尾に追加されます)'); }); });
  });
}
function deleteBookmark(id) {   // 1件の削除(取り消しつき)
  if (!id) return;
  var c = bmContentOf(id);
  if (PF.room.confirmDelete && !confirm('この項目を削除しますか?(削除直後なら「元に戻す」で復元できます)')) return;
  google.script.run.withSuccessHandler(function () {
    refreshBookmarks();
    if (c) undoToast('削除しました', function () { srv('addBookmarksBatch', [[c]], function () { refreshBookmarks(); miniToast('元に戻しました(末尾に追加されます)'); }); });
  }).deleteBookmarkFromServer(id);

/* --- 取り込み(URLをまとめて / YouTubeの再生リスト) と 書き出し --- */
function mModal(title, body, foot) {
  var old = gid('m-ov'); if (old) old.remove();
  var ov = document.createElement('div'); ov.className = 'lp-ov'; ov.id = 'm-ov';
  ov.innerHTML = '<div class="lp"><div class="lp-h"><b>' + title + '</b><button class="sm" onclick="mClose()">✕</button></div><div class="lp-b">' + body + '</div>' + (foot ? '<div class="lp-f">' + foot + '</div>' : '') + '</div>';
  ov.addEventListener('click', function (e) { if (e.target === ov) mClose(); });
  document.body.appendChild(ov);
}
function mClose() { var o = gid('m-ov'); if (o) o.remove(); }
function bmExtractIds(text) {
  var ids = [], seen = {}, add = function (v) { if (v && !seen[v]) { seen[v] = 1; ids.push(v); } };
  String(text || '').replace(/(?:youtu\.be\/|[?&]v=|\/shorts\/|\/embed\/|\/live\/)([\w-]{11})/g, function (m, v) { add(v); return m; });
  String(text || '').split(/\s+/).forEach(function (t) { if (/^[\w-]{11}$/.test(t)) add(t); });
  return ids;
}
function bmExtractPlaylist(s) {
  s = String(s || '').trim(); var m = s.match(/[?&]list=([\w-]{10,64})/); if (m) return m[1];
  return /^(PL|UU|OL|FL|LL|RD)[\w-]{8,60}$/.test(s) ? s : '';

var MIMP = { pl: null };

    '<div class="vm">追加先のリスト(「ジャンル/リスト」のように / で階層)</div><div class="wbar" style="margin:4px 0"><input type="text" id="mi-path" value="' + E(ROOM.path) + '" style="flex:1 1 200px"><button class="sm" onclick="miPick()">📂 選ぶ</button></div>' +
    '<h3>🔗 URL・動画IDをまとめて追加</h3><div class="vm">YouTubeのURLや動画IDを貼り付け(文章の中に混ざっていてもOK)。タイトルは自動で取得します。</div><textarea id="mi-text" placeholder="https://www.youtube.com/watch?v=…&#10;https://youtu.be/…"></textarea>' +

<script id="chat-cinema-script">
(function () {

        url = c.toDataURL("image/jpeg", q);

  function avatarHtml(icon, color, name) {

    return '<div class="cav' + (String(icon || "").indexOf("data:image") === 0 ? "" : " ph") + '" style="background:' + chatSafeColor(color) + '">' + inner + "</div>";
  }
  function ytCardFrom(text) {
    var src = String(text || "");
    var m = src.match(/\[\[yt:([A-Za-z0-9_-]{11})\|([\s\S]*?)\]\]/);
    if (m) return { id: m[1], title: (m[2] || "").trim() || m[1], kind: "watch" };

  }

    var m = Array.isArray(r) ? { name: r[0], text: r[1], color: r[2], clientId: r[3], id: "", icon: "", to: "", edited: false, time: 0 } : r;

    return '<div class="row' + (mine ? " mine" : "") + '">' + avatarHtml(m.icon, m.color, m.name) + '<div><div class="nm" style="color:' + chatSafeColor(m.color) + '">' + E(m.name) + " " + dm + toolsHtml(m) + '</div><div class="bubble">' + msgBody(m) + "</div></div></div>";
  };
  window.editChatMsg = function (id) {
    var next = prompt("メッセージを編集"); if (next == null || !next.trim()) return;

  };
  window.deleteChatMsg = function (id) {
    if (!confirm("このメッセージを削除しますか？")) return;

  window.sendChat = function () {
    var n = document.getElementById("chatName").value.trim();
    var m = document.getElementById("chatMsg").value.trim();
    var c = document.getElementById("chatColor").value;
    var to = (document.getElementById("chat-dm") || {}).value || "";
    var toCid = (typeof CHAT !== "undefined" && CHAT.tab === "dm" && CHAT.partnerCid) ? CHAT.partnerCid : "";
    if (!n || !m) return;
    cfg.chatName = n; cfg.chatColor = c;

var REC_MODES = [['auto', '🤖 おまかせ'], ['std', '🌈 標準'], ['video', '🎬 動画中心'], ['short', '⚡ Shorts中心'], ['live', '🔴 配信中心'], ['all', '🧩 すべて']];
var REC_MODE_HINT = {
  auto: '見た動画の種類から傾向を自動で学習します', std: '動画と配信(Shortsは別枠)', video: '通常の動画を優先して出します',
  short: 'ショート動画を優先して出します', live: 'ライブ配信・配信アーカイブを優先して出します', all: '種類を問わず混ぜます'
};
var REC_KIND_LABEL = { video: '🎬 動画', short: '⚡ Shorts', live: '🔴 配信' };

/* --- 視聴傾向の学習(端末内) --- */
function kindStat() { var s = lsj('ws_kind', null); return (s && s.g && s.c) ? s : { g: { video: 0, short: 0, live: 0 }, c: {} }; }
function bumpKind(kind, cid, w) {
  if (!PF.rec.learn || ['video', 'short', 'live'].indexOf(kind) < 0) return;
  try {
    var s = kindStat(); w = w || 1;
    s.g[kind] = (s.g[kind] || 0) + w;
    if (cid) { var c = s.c[cid] = s.c[cid] || { video: 0, short: 0, live: 0 }; c[kind] = (c[kind] || 0) + w; }
    var tot = (s.g.video || 0) + (s.g.short || 0) + (s.g.live || 0);
    if (tot > 150) {   // 古い傾向は徐々に薄める
      ['video', 'short', 'live'].forEach(function (k) { s.g[k] = Math.floor((s.g[k] || 0) / 2); });
      Object.keys(s.c).forEach(function (id) { var o = s.c[id], t = 0; ['video', 'short', 'live'].forEach(function (k) { o[k] = Math.floor((o[k] || 0) / 2); t += o[k]; }); if (!t) delete s.c[id]; });
    }
    localStorage.setItem('ws_kind', JSON.stringify(s));
  } catch (e) {}
}
function topKind(o, minTotal, minShare) {
  var t = (o.video || 0) + (o.short || 0) + (o.live || 0);
  if (t < minTotal) return '';
  var best = '', bv = -1;
  ['video', 'short', 'live'].forEach(function (k) { if ((o[k] || 0) > bv) { bv = o[k] || 0; best = k; } });
  return bv / t >= minShare ? best : '';
}
function learnedMode() { return topKind(kindStat().g, 5, 0.5) || 'std'; }
function effMode() { var m = PF.rec.mode; return m === 'auto' ? learnedMode() : m; }
function chEffPref(id) {
  if (PF.chPref[id]) return PF.chPref[id];
  if (PF.rec.mode === 'auto' && PF.rec.learn) { var c = kindStat().c[id]; if (c) return topKind(c, 3, 0.6); }
  return '';
}
/* --- 最近見た動画(直近N本だけ記録・それ以前は自動削除) / 最近おすすめに出した動画 --- */
function recentGet() { var a = lsj('ws_recent', []); return Array.isArray(a) ? a : []; }
function recentAdd(id) {
  if (!id) return;
  var a = recentGet().filter(function (x) { return x !== id; });
  a.unshift(id);
  var n = Math.max(10, Math.min(Number(PF.rec.recentN) || 40, 100));
  try { localStorage.setItem('ws_recent', JSON.stringify(a.slice(0, n))); } catch (e) {}
}
function recentSet() { var m = {}; recentGet().forEach(function (x) { m[x] = 1; }); return m; }
function shownGet() { var a = lsj('ws_shown', []); return Array.isArray(a) ? a : []; }
function shownAdd(items) {
  var a = shownGet(), ids = (items || []).map(function (v) { return v.id; });
  a = ids.concat(a.filter(function (x) { return ids.indexOf(x) < 0; })).slice(0, 60);
  try { localStorage.setItem('ws_shown', JSON.stringify(a)); } catch (e) {}
}
function recParams() {
  var prefs = {};
  savedChannels().forEach(function (c) { var p = chEffPref(c.id); if (p) prefs[c.id] = p; });
  return { mode: effMode(), ratio: PF.rec.ratio, disc: PF.rec.disc, prefs: prefs, exclude: recentGet(), soft: shownGet() };
}
var TIER_LABEL = { pop: '🔥人気', mid: '🎲発見' };

/* --- チャンネルの選び方: 好みが合うチャンネルを出やすくする --- */
var WP_CTX = '';
weightedPick = function (k) {
  var cnt = watchCounts(), fav = {};
  if (PF.rec.favBoost) {
    (PF.home.pins || []).forEach(function (i) { fav[i] = 1; });
    var n = {}; try { n = ntfGet() || {}; } catch (e) {}
    (n.ids || []).forEach(function (i) { fav[i] = 1; });
  }
  var M = effMode(), target = WP_CTX === 'short' ? 'short' : ((M === 'std' || M === 'all') ? '' : M);
  var pool = savedChannels().map(function (c) {
    var w = 1 + Math.min(cnt[c.id] || 0, 30) * 1.5, p = chEffPref(c.id);
    if (target) { if (p === target) w *= 2.2; else if (p) w *= 0.6; } else if (p) w *= 1.2;
    if (fav[c.id]) w *= 1.4;
    return { id: c.id, w: w };
  });
  var out = [];
  while (out.length < k && pool.length) {
    var tot = pool.reduce(function (a, x) { return a + x.w; }, 0), r = Math.random() * tot, i = 0;
    for (; i < pool.length - 1; i++) { r -= pool[i].w; if (r <= 0) break; }
    out.push(pool.splice(i, 1)[0]);
  }
  return out;
};
subsSpec = function (k, total) {   // "チャンネルID:本数:好み"
  var pick = weightedPick(k), sum = pick.reduce(function (a, x) { return a + x.w; }, 0) || 1;
  return pick.map(function (x) {
    var p = chEffPref(x.id);
    return x.id + ':' + Math.max(1, Math.min(8, Math.round(total * x.w / sum))) + (p ? ':' + p : '');
  }).join(',');
};

/* --- サーバー呼び出しを新しいおすすめ処理へ切り替え --- */

    try { cached = JSON.parse(localStorage.getItem(key) || 'null'); } catch (e) {}

    if (cached && cached.items && cached.items.length && now - cached.t < 6 * 3600000) {   // 前回の結果を先に表示して待ち時間をなくす
      give({ ok: true, items: cached.items, cached: true });
      if (now - cached.t < 8 * 60000) return;   // 8分以内なら再取得しない
    }
    return _srvM('getRecommendationsV2', [args[0], P], function (r) {
      if (r && r.ok && r.items && r.items.length) { try { localStorage.setItem(key, JSON.stringify({ t: Date.now(), items: r.items.slice(0, 30) })); } catch (e) {} }

  if (fn === 'getWatchData') {

    return _srvM(fn, a, function (r) {

        if (r && r.ok) {

            if (v.kind === 'short') t.push('⚡Shorts'); else if (v.lb === 'live') t.push('🔴ライブ中'); else if (v.kind === 'live') t.push('🔴配信');
            if (TIER_LABEL[v.tier]) t.push(TIER_LABEL[v.tier]);

  }
  return _srvM(fn, args, ok);
};

pfTabX('rec', '🎯 おすすめ', function () {

/* --- DM: 宛先が出ない問題の修正(オンライン+最近いた人を表示 / 即時取得 / 別タブ復帰で再取得) --- */

<script>
/* ===== PART N: リストの入れ込みをかんたんに(ドラッグ / 長押しドラッグ / 📥ボタン / まとめ選択 / 取り消し) ===== */

function bmFolderOfId(id) {
  var out = '';
  Object.keys(folderItems).forEach(function (f) { folderItems[f].forEach(function (b) { if (String(b.id) === String(id)) out = f; }); });
  return out;
}
function mSelPaths() {

}
mSelIds = function () {
  return Array.prototype.filter.call(document.querySelectorAll('#app-view .msel:checked'), function (c) { return !c.classList.contains('fsel'); })
    .map(function (c) { return +c.dataset.id; });
};
mSelUpdate = function () { var n = gid('rm-bn'); if (n) n.textContent = mSelIds().length + mSelPaths().length; };

/* --- 移動の本体: リスト(paths)と動画(ids)を、まとめて dest の中へ。確認なし + 「元に戻す」 --- */
function moveMany(paths, ids, dest) {
  dest = lpCleanPath(dest || '');
  var nodes = bmNodes();
  paths = (paths || []).filter(function (p) { return p !== dest && dest.indexOf(p + '/') !== 0; });
  var merges = paths.filter(function (p) { var np = bmJoin(dest, bmLast(p)); return np !== p && nodes[np] && (nodes[np].items.length || nodes[np].children.length); });
  paths = paths.filter(function (p) { return bmJoin(dest, bmLast(p)) !== p; });
  var origin = (ids || []).map(function (id) { return { id: id, folder: bmFolderOfId(id) }; }).filter(function (x) { return x.folder !== dest; });
  ids = origin.map(function (x) { return x.id; });
  if (!paths.length && !ids.length) { miniToast('すでにその場所にあるか、そこへは移動できません'); return; }

/* --- ドラッグ操作(マウス: 少し動かすと開始 / タッチ: 長押しで開始) --- */
var DND = null, DND_JUST = 0;

<script>
/* ===== PART O: Supabase Auth(Google OAuth)ログイン ===== */
/* ↓ 設定(ここを書き換える): Supabase の anon / publishable キーは公開前提のキーなので、ここに書いて大丈夫です */
var SUPA_URL = 'https://hoaoehdyvjxhwymguepl.supabase.co';
var SUPA_ANON = 'sb_publishable_kGUs7S7Hh0XLMBk_w8rMJg_LceYsj9X';   // yt-viewer の publishable キー(公開前提)
var AUTH_CALLBACK = '';       // 例: https://ユーザー名.github.io/リポジトリ名/auth-callback.html

function supaCb() { var v = AUTH_CALLBACK || ''; try { v = v || localStorage.getItem('ws_auth_cb') || ''; } catch (e) {} return v; }
function supaReady() { return !!(SUPA_URL && SUPA_ANON && supaCb()); }

/* 別タブに表示された8文字コードを Supabase で照合 → 一致したらログイン(1回限り・10分で失効) */
function supaClaim(code) {
  code = String(code || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (code.length !== 8) { acctMsg('コードは8文字です。別タブに表示されたコードをそのまま入力してください。'); return; }

    body: JSON.stringify({ p_code: code })
  }).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
    .then(function (x) {
      var row = x.ok && Array.isArray(x.j) ? x.j[0] : null;

      try {
        localStorage.setItem('ws_user', row.o_email);

/* 入力欄の中身が8文字コードか長い認証コードかを判定して処理 */
function supaCodeLogin(v) {

var SUPA_TIMER = null, SUPA_STATE = '', SUPA_BUSY = false;

  var j = JSON.stringify({ i: st, g: gas || '', u: SUPA_URL, y: yt ? 1 : 0 });

    '<div style="margin-top:6px;font-size:.78rem;opacity:.75">開けない場合は、このリンクをコピーして、新しいタブに貼り付けて開いてください。</div>' +

}

  } catch (e) {}

}
function ytTok() { var i = ytInfo(); return i ? i.tok : ''; }

}

    }).catch(function () {});

}

/* 登録チャンネルの取り込み: ログインしたアカウント本人の登録チャンネルを読む(ブラウザの標準アカウントは使わない) */
var YT_AFTER = '';
function ytImportSubs() {

<script>

  ytFetch('videos/rate?id=' + encodeURIComponent(id) + '&rating=' + next, { method: 'POST' }).then(function () {

#chat-tabs{display:flex;gap:6px;margin:6px 0}
#chat-tabs button{flex:1;padding:8px;border:0;border-radius:99px;background:var(--btn-bg);color:var(--btn-fg);cursor:pointer;font-weight:bold}
#chat-tabs button.on{background:var(--accent);color:var(--on-accent)}
.ct-n{display:none;background:#e53935;color:#fff;border-radius:99px;padding:1px 7px;font-size:.72rem;margin-left:4px}
.ct-n.on{display:inline-block}
#chat-dmhead{display:flex;align-items:center;gap:8px;margin:2px 0 4px;font-weight:bold}
#chat-log .row{display:flex;gap:8px;align-items:flex-start;margin:10px 0}
#chat-log .row.mine{flex-direction:row-reverse}
#chat-log .row.mine .nm{text-align:right}
#chat-log .bubble{background:rgba(255,255,255,.09);padding:8px 12px;border-radius:14px;display:inline-block;max-width:100%;line-height:1.5}
#chat-log .row.mine .bubble{background:var(--accent);color:var(--on-accent)}
.ct-time{opacity:.55;font-size:.7rem;margin-left:6px;font-weight:normal}
.ct-men{background:rgba(255,200,0,.28);border-radius:6px;padding:0 4px;font-weight:bold}
.ct-th{padding:10px 12px;border-radius:12px;background:var(--soft);margin:6px 0;cursor:pointer}
.ct-th:hover{background:var(--btn-bg)}
.ct-new{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
#ct-digest{position:fixed;inset:0;z-index:100010;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center}
#ct-digest .card{background:var(--panel-bg,#111);border:2px solid var(--accent);border-radius:20px;padding:20px;max-width:440px;width:90%;max-height:80vh;overflow-y:auto;color:var(--text,#fff)}
#ct-digest .it{padding:9px 12px;border-radius:10px;background:var(--soft);margin:6px 0;cursor:pointer}
#chat-panel.ws-wp,#config-panel.ws-wp{isolation:isolate;overflow:hidden}
#chat-panel.ws-wp::before,#config-panel.ws-wp::before{content:'';position:absolute;inset:-12px;z-index:-1;background:var(--ws-img) center/cover;filter:brightness(var(--ws-b,1)) blur(var(--ws-blur,0px));opacity:var(--ws-o,1)}
#ws-wall-page{position:absolute;inset:0;z-index:14;background:var(--bg);display:none;overflow:hidden}
#ws-wall-page .wi{position:absolute;inset:-14px;background-size:cover;background-position:center}
#view.ws-wp #app-view.show{background:transparent!important}
</style>
<script>
/* ===== PART R: チャット強化(DM分離・通知・不在中の一覧)と壁紙 ===== */
pfExtend({ wall: { popup: { bright: 100, opacity: 100, blur: 0 }, page: { bright: 100, opacity: 100, blur: 0 } } });

/* ---------- 共通 ---------- */
var CHAT = { tab: 'pub', partner: '', data: [], init: false, since: 0 };
try { CHAT.since = parseInt(localStorage.getItem('ws_chat_last') || '0', 10) || 0; } catch (e) {}
function chMe() { return String((gid('chatName') || {}).value || cfg.chatName || '').trim(); }
function chIsMine(m) { return (m.clientId && m.clientId === chatClientId()) || String(m.name).trim() === chMe(); }
function chMention(text, me) { var t = String(text || '').toLowerCase(); if (/@(all|everyone|here|全員|みんな)/.test(t)) return true; return !!me && t.indexOf('@' + me.toLowerCase()) >= 0; }
function chMarkMen(html, me) {
  return html.split(/(<[^>]+>)/).map(function (p) {
    if (p.charAt(0) === '<') return p;
    return p.replace(/@(all|everyone|here|全員|みんな)|@[^\s<@]{1,20}/gi, function (x) {
      var mine = me && x.toLowerCase() === '@' + me.toLowerCase(), all = /^@(all|everyone|here|全員|みんな)$/i.test(x);
      return (mine || all) ? '<span class="ct-men">' + x + '</span>' : x;
    });
  }).join('');
}
function chFmtT(t) {
  var d = new Date(t), n = new Date(), hh = ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
  return d.toDateString() === n.toDateString() ? hh : (d.getMonth() + 1) + '/' + d.getDate() + ' ' + hh;
}
function chRow(m) {
  var h = chatRowHtml(m), tm = m.time ? '<span class="ct-time">' + chFmtT(m.time) + '</span>' : '';
  h = h.replace('</div><div class="bubble">', tm + '</div><div class="bubble">');
  return chMarkMen(h, chMe());
}
function chJ(k, d) { try { var v = JSON.parse(localStorage.getItem(k) || 'null'); return v == null ? d : v; } catch (e) { return d; } }
function chS(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function chU() { var u = chJ('ws_chat_u', {}); u.dm = u.dm || {}; u.pub = u.pub || 0; u.men = u.men || 0; return u; }

/* ---------- 画面の作り替え(タブ・DM一覧) ---------- */
(function () {
  var log = gid('chat-log'); if (!log || gid('chat-tabs')) return;
  log.insertAdjacentHTML('beforebegin', '<div id="chat-tabs"><button id="ct-pub" class="on" onclick="chatTab(\'pub\')">💬 全体<b id="ct-pub-n" class="ct-n"></b></button><button id="ct-dm" onclick="chatTab(\'dm\')">🔒 DM<b id="ct-dm-n" class="ct-n"></b></button></div><div id="chat-dmhead" style="display:none"></div>');
  var sel = gid('chat-dm'); if (sel) sel.style.display = 'none';   // 送信先はタブで決める
  var mi = gid('chatMsg'); if (mi) mi.insertAdjacentHTML('beforebegin', '<button class="mini" title="全員にメンション" onclick="var i=gid(\'chatMsg\');i.value=\'@全員 \'+i.value;i.focus()">@全員</button>');
})();
function chSetTarget(v) {
  var sel = gid('chat-dm'); if (!sel) return;
  if (v && !Array.prototype.some.call(sel.options, function (o) { return o.value === v; })) sel.insertAdjacentHTML('beforeend', '<option value="' + E(v) + '">DM: ' + E(v) + '</option>');
  sel.value = v;
}
function chatTab(t) { CHAT.tab = t; CHAT.partner = ''; chSetTarget(''); if (t === 'pub') { var u = chU(); u.pub = 0; chS('ws_chat_u', u); } CHAT.force = true; chatRender(); }
function chatOpenDm(who) {
  CHAT.tab = 'dm'; CHAT.partner = who; chSetTarget(who);
  var u = chU(); u.dm[who] = 0; chS('ws_chat_u', u);
  var lg = chJ('ws_chat_log', []); lg.forEach(function (x) { if (x.k === 'dm' && x.who === who) x.read = true; }); chS('ws_chat_log', lg);
  CHAT.force = true; chatRender(); var mi = gid('chatMsg'); if (mi) mi.focus();
}
function chatBackDm() { CHAT.partner = ''; chSetTarget(''); chatRender(); }
function chThreads(d, me) {
  var T = {};
  d.forEach(function (m) {
    if (!m.to) return;
    var mine = String(m.name).trim() === me, other = mine ? String(m.to).trim() : String(m.name).trim();
    if (!other) return;
    var t = T[other] = T[other] || { who: other, last: '', t: 0 };
    if ((m.time || 0) >= t.t) { t.t = m.time || 0; t.last = (mine ? 'あなた: ' : '') + String(m.text).slice(0, 40); }
  });
  return Object.keys(T).map(function (k) { return T[k]; }).sort(function (a, b) { return b.t - a.t; });
}
function chatRender() {
  var log = gid('chat-log'); if (!log) return;
  var me = chMe(), d = CHAT.data || [], u = chU(), html = '';
  var near = log.scrollHeight - log.scrollTop - log.clientHeight < 60;
  var dmN = Object.keys(u.dm).reduce(function (a, k) { return a + (u.dm[k] || 0); }, 0);
  var b1 = gid('ct-pub'), b2 = gid('ct-dm'), n1 = gid('ct-pub-n'), n2 = gid('ct-dm-n'), head = gid('chat-dmhead');
  if (b1) b1.className = CHAT.tab === 'pub' ? 'on' : ''; if (b2) b2.className = CHAT.tab === 'dm' ? 'on' : '';
  if (n1) { n1.textContent = u.pub > 99 ? '99+' : u.pub; n1.classList.toggle('on', u.pub > 0 && CHAT.tab !== 'pub'); }
  if (n2) { n2.textContent = dmN > 99 ? '99+' : dmN; n2.classList.toggle('on', dmN > 0); }
  if (CHAT.tab === 'pub') {
    if (head) head.style.display = 'none';
    html = d.filter(function (m) { return !m.to; }).map(chRow).join('') || '<div class="vm">まだメッセージはありません</div>';
  } else if (!CHAT.partner) {
    if (head) head.style.display = 'none';
    var th = chThreads(d, me), used = {};
    html = th.map(function (t) {
      used[t.who] = 1; var c = u.dm[t.who] || 0;
      return '<div class="ct-th" data-w="' + E(t.who) + '" onclick="chatOpenDm(this.dataset.w)"><b>' + E(t.who) + '</b>' + (c ? '<b class="ct-n on">' + c + '</b>' : '') + '<span class="ct-time">' + (t.t ? chFmtT(t.t) : '') + '</span><div class="vm">' + E(t.last) + '</div></div>';
    }).join('');
    var sel = gid('chat-dm'), others = sel ? Array.prototype.map.call(sel.options, function (o) { return o.value; }).filter(function (v) { return v && !used[v]; }) : [];
    html += '<div class="vm" style="margin-top:10px">新しくDMを送る相手:</div><div class="ct-new">' +
      (others.map(function (w) { return '<button class="sm" data-w="' + E(w) + '" onclick="chatOpenDm(this.dataset.w)">' + E(w) + '</button>'; }).join('') || '<span class="vm">相手が見つかりません(相手がチャットを開くと表示されます)</span>') + '</div>';
  } else {
    if (head) { head.style.display = 'flex'; head.innerHTML = '<button class="sm" onclick="chatBackDm()">← 一覧</button>🔒 ' + E(CHAT.partner) + ' とのDM'; }
    var p = CHAT.partner;
    html = d.filter(function (m) { if (!m.to) return false; var a = String(m.name).trim(), b = String(m.to).trim(); return (a === me && b === p) || (a === p && b === me); }).map(chRow).join('') || '<div class="vm">まだメッセージはありません。下の欄から送れます。</div>';
  }
  log.innerHTML = html;
  if (near || CHAT.force) { log.scrollTop = log.scrollHeight; CHAT.force = false; }
  chatBadge();
}
var _sendChatR = window.sendChat;
window.sendChat = function () {
  if (CHAT.tab === 'dm' && !CHAT.partner) { miniToast('DMの相手を選んでください'); return; }
  CHAT.force = true; _sendChatR();
};

/* ---------- 通知(重要: DM・全体メンション / DMは送り主ごとに件数でまとめる) ---------- */
function chToast(id, html, fn) {
  var e = gid('ct-toast-' + id);
  if (!e) { e = document.createElement('div'); e.id = 'ct-toast-' + id; e.className = 'ntf-toast'; document.body.appendChild(e); }
  e.innerHTML = html; e.onclick = function () { if (e.parentNode) e.parentNode.removeChild(e); fn(); };
  var n = document.querySelectorAll('.ntf-toast'); Array.prototype.forEach.call(n, function (x, i) { x.style.bottom = (14 + i * 74) + 'px'; });
  clearTimeout(e._t); e._t = setTimeout(function () { if (e.parentNode) e.parentNode.removeChild(e); }, 12000);
}
function chLogAdd(k, who, text, n) {
  var lg = chJ('ws_chat_log', []);
  if (k === 'dm') {
    var f = null; lg.forEach(function (x) { if (x.k === 'dm' && x.who === who && !x.read) f = x; });
    if (f) { f.n += n; f.text = text; f.t = Date.now(); } else lg.unshift({ k: 'dm', who: who, n: n, text: text, t: Date.now(), read: false });
  } else lg.unshift({ k: 'men', who: who, n: 1, text: text, t: Date.now(), read: false });
  chS('ws_chat_log', lg.slice(0, 40));
}
function chatBadge() {
  var u = chU(), dmN = Object.keys(u.dm).reduce(function (a, k) { return a + (u.dm[k] || 0); }, 0), imp = dmN + (u.men || 0);
  var dot = gid('chat-dot'); if (!dot) return;
  var on = imp > 0 || (u.pub > 0 && cfg.chatNotify !== false);
  dot.classList.toggle('on', on); dot.textContent = imp > 0 ? (imp > 9 ? '9+' : String(imp)) : '';
}
function chOpenPanel(tab, who) {
  var p = gid('chat-panel'); if (p && !p.classList.contains('open')) toggleChat();
  if (tab === 'dm' && who) chatOpenDm(who); else chatTab('pub');
}
function chProcess(data) {
  var me = chMe(), seen = chJ('ws_chat_seen', []), set = {}, first = !CHAT.init, changed = false;
  seen.forEach(function (x) { set[x] = 1; });
  var open = gid('chat-panel').classList.contains('open'), u = chU();
  (data || []).forEach(function (m) {
    var id = m.id || (m.name + '|' + m.time + '|' + String(m.text).slice(0, 20)); if (set[id]) return;
    set[id] = 1; seen.push(id); changed = true;
    if (first || chIsMine(m)) return;   // 起動直後の分は「不在の間の通知」で扱う
    var _imp = (m.to && String(m.to).trim() === me) || (!m.to && chMention(m.text, me));   // 通知音: 重要(DM・メンション)は専用設定、通常は従来の「チャットの音」設定に従う
    if (_imp ? (PF.chatx && PF.chatx.sound) : (PF.sound && PF.sound.chat && cfg.chatNotify !== false)) chSound();
    var dm = m.to && String(m.to).trim() === me, men = !m.to && chMention(m.text, me), who = String(m.name).trim();
    if (dm) {
      var viewing = open && CHAT.tab === 'dm' && CHAT.partner === who;
      if (!viewing) {
        u.dm[who] = (u.dm[who] || 0) + 1; chLogAdd('dm', who, String(m.text).slice(0, 60), 1);
        chToast('dm-' + who.replace(/\W/g, '_'), '🔒 <b>' + E(who) + '</b> から <b>' + u.dm[who] + '件</b> のDMが来ています', function () { chOpenPanel('dm', who); });
      }
    } else if (men) {
      if (!(open && CHAT.tab === 'pub')) { u.men++; chLogAdd('men', who, String(m.text).slice(0, 80), 1); chToast('men-' + id.replace(/\W/g, '_').slice(0, 20), '📣 <b>' + E(who) + '</b> が全体にメンション<br>' + E(String(m.text).slice(0, 60)), function () { chOpenPanel('pub'); }); }
    } else if (!m.to && !(open && CHAT.tab === 'pub')) { u.pub++; }
  });
  if (changed) { chS('ws_chat_seen', seen.slice(-400)); chS('ws_chat_u', u); }
  CHAT.init = true;
}
/* 不在の間の通知(起動直後に1回): DMは送り主ごとの件数でまとめて一覧表示 */
function chDigest() {
  var me = chMe(); if (!CHAT.since || !me) return;
  google.script.run.withSuccessHandler(function (r) {
    if (!r || !r.ok || (!r.dm.length && !r.mentions.length)) return;
    var u = chU(); r.dm.forEach(function (d) { u.dm[d.who] = (u.dm[d.who] || 0) + d.count; chLogAdd('dm', d.who, d.last, d.count); });
    r.mentions.slice().reverse().forEach(function (x) { u.men++; chLogAdd('men', x.who, x.text, 1); });
    chS('ws_chat_u', u); chatBadge(); chatRender();
    var h = '<div id="ct-digest"><div class="card"><h3 style="margin:0 0 8px">🔔 いない間の通知</h3>';
    r.dm.forEach(function (d) { h += '<div class="it" data-w="' + E(d.who) + '" onclick="chDigestClose();chOpenPanel(\'dm\',this.dataset.w)">🔒 <b>' + E(d.who) + '</b> から <b>' + d.count + '件</b> のDM<div class="vm">' + E(d.last) + '</div></div>'; });
    r.mentions.forEach(function (x) { h += '<div class="it" onclick="chDigestClose();chOpenPanel(\'pub\')">📣 <b>' + E(x.who) + '</b> が全体にメンション<div class="vm">' + E(x.text) + '</div></div>'; });
    if (r.pub) h += '<div class="vm" style="margin:8px 0">💬 全体チャットにほかに ' + r.pub + ' 件のメッセージがあります</div>';
    h += '<div style="text-align:right;margin-top:10px"><button class="sm" onclick="chDigestClose()">閉じる</button></div></div></div>';
    document.body.insertAdjacentHTML('beforeend', h);
  }).getChatDigest(chatClientId(), me, CHAT.since);
}
function chDigestClose() { var e = gid('ct-digest'); if (e) e.remove(); }

/* ---------- 読み込み(既存のloadChatを置き換え) ---------- */
window.loadChat = function () {
  if (typeof google === 'undefined' || !google.script) return;
  var name = chMe();
  google.script.run.withSuccessHandler(function (data) {
    if (!gid('chat-log')) return;
    CHAT.data = data || [];
    var firstLoad = !CHAT.init;
    chProcess(CHAT.data); chatRender();
    try { localStorage.setItem('ws_chat_last', String(Date.now())); } catch (e) {}   // 最後にこの画面を見ていた時刻
    if (firstLoad) chDigest();
  }).getMsgs(chatClientId(), name);
};
chatRead = function () { var u = chU(); u.pub = 0; chS('ws_chat_u', u); chatBadge(); };
setTimeout(function () { try { loadChat(); } catch (e) {} }, 1500);

/* 通知ページに「チャットの通知」を表示(DMは送り主ごとにまとめる) */
var _showNotifsR = showNotifs;
showNotifs = function () {
  _showNotifsR.apply(this, arguments);
  var pg = document.querySelector('#app-view .pg'); if (!pg) return;
  var lg = chJ('ws_chat_log', []);
  var h = '<h3>💬 チャットの通知</h3>';
  h += lg.length ? lg.map(function (x, i) {
    return '<div class="it" style="padding:10px 12px;border-radius:12px;background:var(--soft);margin:6px 0;cursor:pointer" data-k="' + x.k + '" data-w="' + E(x.who) + '" onclick="chOpenPanel(this.dataset.k===\'dm\'?\'dm\':\'pub\',this.dataset.w)">' +
      (x.k === 'dm' ? '🔒 <b>' + E(x.who) + '</b> から <b>' + x.n + '件</b> のDMが来ています' : '📣 <b>' + E(x.who) + '</b> が全体にメンション') +
      (x.read ? '' : ' 🆕') + '<div class="vm">' + E(x.text) + ' ・ ' + chFmtT(x.t) + '</div></div>';
  }).join('') : '<div class="vm">DM・メンションの通知はありません</div>';
  pg.insertAdjacentHTML('afterbegin', h + '<div class="wbar"><button class="sm" onclick="chS(\'ws_chat_log\',[]);showNotifs()">チャット通知の履歴を消す</button></div>');
  lg.forEach(function (x) { x.read = true; }); chS('ws_chat_log', lg);
};

/* ---------- 壁紙(ポップアップ系 / 通常画面) ---------- */
function wallGet(k) { try { return localStorage.getItem('ws_wall_' + k) || ''; } catch (e) { return ''; } }
function wallApply() {
  var W2 = PF.wall || {}, pu = W2.popup || {}, pg = W2.page || {}, img = wallGet('popup'), pimg = wallGet('page');
  ['chat-panel', 'config-panel'].forEach(function (id) {
    var el = gid(id); if (!el) return;
    if (img) { el.classList.add('ws-wp'); el.style.setProperty('--ws-img', 'url("' + img + '")'); el.style.setProperty('--ws-b', (pu.bright || 100) / 100); el.style.setProperty('--ws-o', (pu.opacity == null ? 100 : pu.opacity) / 100); el.style.setProperty('--ws-blur', (pu.blur || 0) + 'px'); }
    else el.classList.remove('ws-wp');
  });
  var view = gid('view'), layer = gid('ws-wall-page');
  if (!layer && view) { view.insertAdjacentHTML('afterbegin', '<div id="ws-wall-page"><div class="wi"></div></div>'); layer = gid('ws-wall-page'); }
  if (layer && view) {
    if (pimg) { var wi = layer.firstChild; wi.style.backgroundImage = 'url("' + pimg + '")'; wi.style.filter = 'brightness(' + (pg.bright || 100) / 100 + ') blur(' + (pg.blur || 0) + 'px)'; wi.style.opacity = (pg.opacity == null ? 100 : pg.opacity) / 100; view.classList.add('ws-wp'); }
    else view.classList.remove('ws-wp');
    wallSync();
  }
}
function wallSync() {
  var av = gid('app-view'), layer = gid('ws-wall-page'), view = gid('view');
  if (layer && av && view) layer.style.display = (view.classList.contains('ws-wp') && av.classList.contains('show')) ? 'block' : 'none';
}
try { new MutationObserver(wallSync).observe(gid('app-view'), { attributes: true, attributeFilter: ['class'] }); } catch (e) {}
function wallPick(area, input) {
  var f = input.files && input.files[0]; if (!f) return;
  var rd = new FileReader();
  rd.onload = function () {
    var im = new Image();
    im.onload = function () {
      var max = 1400, s = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement('canvas');
      c.width = Math.round(im.width * s); c.height = Math.round(im.height * s);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      try { localStorage.setItem('ws_wall_' + area, c.toDataURL('image/jpeg', 0.78)); } catch (e) { alert('画像を保存できませんでした(容量不足)。小さい画像で試してください。'); return; }
      wallApply(); if (typeof pfRefresh === 'function') pfRefresh();
    };
    im.src = rd.result;
  };
  rd.readAsDataURL(f);
}
function wallClear(area) { try { localStorage.removeItem('ws_wall_' + area); } catch (e) {} wallApply(); if (typeof pfRefresh === 'function') pfRefresh(); }
function wallSet(area, key, v) {
  PF.wall[area][key] = +v; pfSave(); wallApply();
  var l = gid('wl-' + area + '-' + key); if (l) l.textContent = v + (key === 'blur' ? 'px' : '%');
}
function wallSection(area, title) {
  var o = PF.wall[area], has = !!wallGet(area);
  function sl(key, label, min, max) {
    return '<div style="margin:8px 0"><div>' + label + ': <b id="wl-' + area + '-' + key + '">' + o[key] + (key === 'blur' ? 'px' : '%') + '</b></div>' +
      '<input type="range" min="' + min + '" max="' + max + '" value="' + o[key] + '" style="width:100%" oninput="wallSet(\'' + area + '\',\'' + key + '\',this.value)"></div>';
  }
  return '<h4 style="margin:14px 0 4px">' + title + '</h4>' +
    (has ? '<img src="' + E(wallGet(area)) + '" style="max-width:100%;max-height:120px;border-radius:10px;display:block;margin:6px 0" alt="">' : '<div class="vm">画像が設定されていません</div>') +

.tu-win{width:min(1080px,96vw);height:min(660px,92vh);background:var(--bg,#111);color:var(--text,#fff);border:2px solid var(--accent,#29b6f6);border-radius:22px;display:flex;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.tu-side{width:210px;flex-shrink:0;background:rgba(255,255,255,.05);padding:14px 10px;overflow-y:auto}
.tu-side h2{font-size:1rem;margin:2px 6px 10px}
.tu-nav{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:10px;cursor:pointer;font-size:.88rem;margin:2px 0}
.tu-nav:hover{background:rgba(255,255,255,.09)}
.tu-nav.on{background:var(--accent,#29b6f6);color:var(--on-accent,#000);font-weight:bold}
.tu-nav .ck{margin-left:auto;opacity:.9}
.tu-main{flex:1;display:flex;flex-direction:column;min-width:0}
.tu-head{display:flex;align-items:center;padding:12px 18px;border-bottom:1px solid rgba(255,255,255,.12);gap:10px}
.tu-head h3{margin:0;font-size:1.15rem;flex:1}
.tu-x{background:transparent;border:0;color:inherit;font-size:1.3rem;cursor:pointer}
.tu-body{flex:1;display:flex;gap:18px;padding:16px 18px;overflow:hidden;min-height:0}
.tu-text{flex:1;overflow-y:auto;min-width:0;padding-right:6px}
.tu-lead{opacity:.85;margin:0 0 10px;line-height:1.6}
.tu-steps{margin:0;padding:0;list-style:none;counter-reset:s}
.tu-steps li{counter-increment:s;position:relative;padding:9px 10px 9px 40px;margin:7px 0;background:rgba(255,255,255,.06);border-radius:12px;line-height:1.55;font-size:.9rem;opacity:0;transform:translateX(-14px);animation:tuIn .5s forwards}
.tu-steps li::before{content:counter(s);position:absolute;left:10px;top:9px;width:22px;height:22px;border-radius:50%;background:var(--accent,#29b6f6);color:var(--on-accent,#000);font-weight:bold;text-align:center;line-height:22px;font-size:.8rem}
@keyframes tuIn{to{opacity:1;transform:none}}
.tu-tip{margin-top:10px;padding:10px 12px;border-left:4px solid #ffc107;background:rgba(255,193,7,.12);border-radius:8px;font-size:.85rem;line-height:1.5}
.tu-stage{width:46%;flex-shrink:0;border-radius:16px;background:linear-gradient(135deg,#1a2540,#2a1a40);position:relative;overflow:hidden;min-height:260px}
.tu-foot{display:flex;align-items:center;gap:10px;padding:10px 18px;border-top:1px solid rgba(255,255,255,.12)}
.tu-dots{flex:1;display:flex;gap:6px;justify-content:center}
.tu-dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.25);cursor:pointer;transition:.2s}
.tu-dots i.on{background:var(--accent,#29b6f6);transform:scale(1.4)}
.tu-btn{background:var(--accent,#29b6f6);color:var(--on-accent,#000);border:0;border-radius:99px;padding:8px 18px;font-weight:bold;cursor:pointer}
.tu-btn.g{background:rgba(255,255,255,.12);color:inherit}
@media(max-width:760px){.tu-side{display:none}.tu-body{flex-direction:column;overflow-y:auto}.tu-stage{width:100%}}
/* --- デモ部品 --- */
.dm{position:absolute;inset:0;padding:14px;font-size:.78rem}
.dm .btn{display:inline-block;background:#29b6f6;color:#000;border-radius:99px;padding:6px 12px;font-weight:bold}
.dm .card{background:#26324f;border-radius:10px;padding:8px}
.dm .th{height:52px;border-radius:8px;background:linear-gradient(135deg,#4e6bff,#b04eff);margin-bottom:6px}
.cur{position:absolute;width:0;height:0;z-index:9;font-size:22px;filter:drop-shadow(0 2px 3px #000)}
.cur::after{content:'👆';position:absolute;left:-6px;top:-4px}
.rip{position:absolute;width:30px;height:30px;border-radius:50%;border:3px solid #fff;opacity:0;transform:scale(.3)}
@keyframes ripA{0%{opacity:0;transform:scale(.3)}10%{opacity:.9}35%{opacity:0;transform:scale(1.6)}100%{opacity:0}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes pop{0%,100%{transform:scale(1)}15%{transform:scale(1.5) rotate(-12deg)}30%{transform:scale(1)}}
@keyframes slideUp{0%,8%{transform:translateY(30px);opacity:0}16%,88%{transform:none;opacity:1}100%{opacity:0}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes type8{0%,25%{width:0}55%,100%{width:8ch}}
@keyframes ring{0%,100%{transform:rotate(0)}10%{transform:rotate(18deg)}20%{transform:rotate(-16deg)}30%{transform:rotate(12deg)}40%{transform:rotate(0)}}
@keyframes wave{0%{transform:scale(.4);opacity:.9}100%{transform:scale(2.2);opacity:0}}
@keyframes fly{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(150px,-60px) rotate(25deg);opacity:0}}
@keyframes keyp{0%,70%,100%{transform:none;box-shadow:0 4px 0 #000}80%,90%{transform:translateY(4px);box-shadow:0 0 0 #000;background:var(--accent,#29b6f6);color:#000}}

/* ---------- チャット画像: Driveに保存 → 照合IDで表示 → クリックで拡大 ---------- */
var CH_IMG = {}, CH_DATA = {}, CH_IMG_RE = /\[\[IMG:(zz_[a-f0-9]{16})\]\]/g;
function chImgTag(id) {

  return src ? '<span class="ct-img" data-id="' + id + '" data-done="1"><img src="' + E(src) + '" alt="画像" data-id="' + id + '" onclick="chLightbox(this)" onerror="chImgFallback(this)"></span>'

(function () {
  var mi = gid('chatMsg');

<script>
/* ===== PART AB: チャット画像の保存先を Supabase Storage に変更(ドメイン管理者がDriveを無効にしているため) =====
   ファイル名=照合ID(zz_ + 16桁 + .jpg)。チャットには [[IMG:照合ID]] を投稿。表示はURLで直接読み込み */
var SUPA_IMG_BASE = SUPA_URL + '/storage/v1/object/public/chat-images/';
chImgTag = function (id) {
  return '<span class="ct-img" data-id="' + id + '" data-done="1"><img src="' + E(SUPA_IMG_BASE + id + '.jpg') + '" alt="画像" data-id="' + id + '" loading="lazy" onclick="chLightbox(this)" onerror="chImgFallback(this)"></span>';
};
chImgFallback = function (img) { img.alt = '画像を表示できません'; img.style.minWidth = '120px'; img.style.minHeight = '60px'; };
chLightbox = function (img) {
  var o = document.createElement('div'); o.id = 'ws-lb';
  o.innerHTML = '<span class="x">✕</span><img src="' + E(img.src) + '" alt="">';
  o.onclick = function () { o.remove(); };
  document.body.appendChild(o);
};
function chNewImgId() { var a = new Uint8Array(8); crypto.getRandomValues(a); return 'zz_' + Array.prototype.map.call(a, function (b) { return ('0' + b.toString(16)).slice(-2); }).join(''); }
chImgPick = function (input) {
  var f = input.files && input.files[0]; input.value = ''; if (!f) return;
  if (CHAT.tab === 'dm' && !CHAT.partner) { miniToast('DMの相手を選んでください'); return; }
  var rd = new FileReader();
  rd.onload = function () {
    var im = new Image();
    im.onload = function () {
      function make(max, q, cb) {
        var s = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement('canvas');
        c.width = Math.round(im.width * s); c.height = Math.round(im.height * s);
        var x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(im, 0, 0, c.width, c.height);
        c.toBlob(cb, 'image/jpeg', q);
      }
      miniToast('📷 画像を送信中...');
      make(1600, 0.82, function (blob) {
        if (blob && blob.size > 1900000) { make(1200, 0.7, function (b2) { upload(b2); }); } else upload(blob);
      });
      function upload(blob) {
        if (!blob) { alert('画像を変換できませんでした'); return; }
        var id = chNewImgId();
        fetch(SUPA_URL + '/storage/v1/object/chat-images/' + id + '.jpg', {
          method: 'POST', headers: { apikey: SUPA_ANON, 'Content-Type': 'image/jpeg', 'x-upsert': 'false' }, body: blob
        }).then(function (r) {
          if (!r.ok) return r.text().then(function (t) { throw new Error('HTTP ' + r.status + ' ' + t.slice(0, 100)); });
          var mi = gid('chatMsg'), cap = (mi.value || '').trim();
          mi.value = '[[IMG:' + id + ']]' + (cap ? '\n' + cap : '');
          CHAT.force = true; window.sendChat();
        }).catch(function (e) { alert('画像を送れませんでした: ' + e.message); });
      }
    };
    im.src = rd.result;
  };
  rd.readAsDataURL(f);
};
</script>

<script>
/* ===== PART AG: ①おすすめの「除外リスト」の修正 ②チャット通知音の修正 ===== */
/* ① bmSample は「YouTubeの動画ID」を返す関数。除外リスト(とその中のリスト)にある動画を、候補から外す */
function aeLabel(p) {
  if (aeExcluded().indexOf(p) >= 0) return '✓ おすすめの参考にする(いま除外中)';
  if (aeIsEx(p)) return '上位のリストが除外中';
  return '🚫 おすすめの参考にしない';
}
bmSample = function (n) {
  var ids = [], seen = {};
  Object.keys(folderItems).forEach(function (k) {
    if (aeIsEx(k)) return;
    folderItems[k].forEach(function (b) { var v = getVideoId(b.url); if (v && !seen[v]) { seen[v] = 1; ids.push(v); } });
  });
  return ids.sort(function () { return Math.random() - 0.5; }).slice(0, n);
};
aeToggleEx = function (path) {
  var a = aeExcluded().slice(), i = a.indexOf(path);
  if (i < 0 && aeIsEx(path)) { miniToast('上位のリストが除外されています。解除は、上位のリストで行ってください'); return; }
  if (i >= 0) a.splice(i, 1); else a.push(path);
  PF.rec.exLists = a; pfSave();
  var b = gid('ct-exlist'); if (b) b.textContent = aeLabel(path);
  miniToast(a.indexOf(path) >= 0 ? '🚫 このリスト(と中のリスト)は、おすすめの参考にしません' : '✓ このリストを、おすすめの参考にします');
};

/* ② 通知音: 音の仕組み(AudioContext)は、画面を1回操作するまで、ブラウザの制限で無音になる。操作のたびに「解除」しておく */
var SND_WARNED = false, CH_SND_T = 0;
function sndCtx() {
  var AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null;
  if (!_snd) _snd = new AC();
  return _snd;
}
['pointerdown', 'keydown', 'touchstart', 'click'].forEach(function (ev) {
  document.addEventListener(ev, function () { try { var c = sndCtx(); if (c && c.state === 'suspended') c.resume(); } catch (e) {} }, true);
});
soundPlay = function (kind, force) {
  var S = PF.sound; if (!force && !S) return;
  var c = sndCtx(); if (!c) return;
  var run = function () {
    try {
      var v = Math.max(0.001, (S.vol / 100) * 0.4), t = c.currentTime + 0.02, seq = SND_TONES[S.tone] || SND_TONES.chime;

        o.start(t + n[1]); o.stop(t + n[1] + n[2] + 0.05);

  };
  if (c.state === 'running') { run(); return; }
  var p; try { p = c.resume(); } catch (e) {}
  if (p && p.then) p.then(function () {
    if (c.state === 'running') run();
    else if (!SND_WARNED) { SND_WARNED = true; miniToast('🔇 通知音を鳴らすため、この画面を1回クリックしてください(ブラウザの制限です)'); }

};

</script>

function gmHas(m, label) { return (m.labelIds || []).indexOf(label) >= 0; }
function gmWho() {

}
function gmUnreadR() { return gmFetch('labels/INBOX').then(function (l) { return { ok: true, unread: l.threadsUnread || 0 }; }); }

function gmList(opt) {
  opt = opt || {};
  var q = (GM_BOXQ[opt.box] || GM_BOXQ.inbox) + (opt.q ? ' ' + String(opt.q).replace(/[\r\n]+/g, ' ').slice(0, 200) : '');

function gmThread(id, markRead) {

function gmHtml(msgId) {

function gmAttachment(msgId, idx) {
  var a = (GMA.att[msgId] || [])[Number(idx) || 0];
  if (!a) return Promise.resolve({ ok: false, reason: '添付が見つかりません(スレッドを開き直してください)' });

/* --- 送信用のMIME作成(件名・名前は =?UTF-8?B? でエンコード、本文はbase64) --- */
function gmAddrs(s) {
  var list = String(s || '').split(/[,;\n]+/).map(function (x) { return x.trim(); }).filter(Boolean), bad = '';
  list.forEach(function (x) {
    var m = x.match(/<([^<>]+)>\s*$/), addr = (m ? m[1] : x).trim();

}

function gmSend(o) {

var GMA_FN = { gmailList: gmList, gmailUnread: gmUnreadR, gmailWho: gmWho, gmailThread: gmThread, gmailHtml: gmHtml, gmailAttachment: gmAttachment, gmailSend: gmSend, gmailReply: gmReply, gmailAction: gmAction };

/* --- 許可(別タブ + 8文字コード)。YouTubeの許可と同じ流れで、Gmailの権限も一緒に頼む --- */
function mlAuthStart() {

    '<div class="vm" style="margin:4px 0">別タブで「③ YouTube+Gmailの許可つき」を押し、使いたいアカウントを選んで許可すると、8文字のコードが出ます。開けない場合は下のリンクをコピーして新しいタブで開いてください。</div>' +

    '<div class="vm" id="ml-auth-msg"></div></div>';

var _acctMsgA = acctMsg;
