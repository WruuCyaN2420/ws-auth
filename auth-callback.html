<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ログイン完了</title>
<style>body{font-family:sans-serif;background:#111;color:#fff;text-align:center;padding:28px;line-height:1.7}
#m{font-size:1.05rem}
#code{font-size:2.6rem;font-weight:bold;letter-spacing:.35em;margin:14px 0;color:#29b6f6;font-family:monospace}
textarea{width:92%;height:90px;background:#000;color:#0f0;border:1px solid #444;border-radius:8px;padding:8px;word-break:break-all}
button{background:#29b6f6;border:0;border-radius:99px;padding:10px 20px;font-weight:bold;margin:8px}</style></head>
<body>
<p id="m">ログイン処理中...</p>
<div id="go" style="display:none">
  <button id="go1">① ログインのみ(YouTube許可なし)</button><br>
  <button id="go2">② YouTubeの許可つきで進む(高評価・コメント・登録チャンネル用)</button><br>
  <button id="go3">③ YouTube+Gmailの許可つきで進む(メールの受信・送信用)</button><br>
  <button id="go4" style="background:#9146ff;color:#fff">④ Twitchでログイン</button>
  <p style="font-size:.8rem;opacity:.7">先に①で試すと、フィルターに止められる箇所を切り分けられます。</p>
</div>
<div id="cd" style="display:none">
  <div id="code"></div>
  <button onclick="navigator.clipboard&&navigator.clipboard.writeText(document.getElementById('code').textContent);this.textContent='コピーしました'">コードをコピー</button>
  <p style="font-size:.85rem;opacity:.8">この8文字を、元の画面の「別タブに表示されたコード」欄に入力して「コードで完了」を押してください。<br>10分で無効になります。他の人に見せないでください。</p>
</div>
<div id="fb" style="display:none">
  <p style="font-size:.8rem;opacity:.7">(予備)コードが使えない場合は、下の認証コードを貼り付けてください。</p>
  <textarea id="tk" readonly></textarea>
</div>
<script>
(function () {
  /* Supabase の publishable キー(公開前提のキー)。URLに入れるとフィルターに止められるため、ここに持たせています */
  var PUBLIC_KEY = 'sb_publishable_kGUs7S7Hh0XLMBk_w8rMJg_LceYsj9X';
  var m = document.getElementById('m');
  var hp = new URLSearchParams(location.hash.replace(/^#/, '')), q = new URLSearchParams(location.search);

  function b64url(buf) {
    var s = ''; new Uint8Array(buf).forEach(function (b) { s += String.fromCharCode(b); });
    return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  function randStr(n) { var a = new Uint8Array(n); crypto.getRandomValues(a); return b64url(a.buffer); }

  /* ---- ① 開始モード: 元の画面のリンクから来た → 準備して「進むボタン」を出す(自動では移動しない) ---- */
  var SP = null;   // 新形式: #s=<base64url(JSON)>  /  旧形式: #start=...&gas=...&sb=...
  if (hp.get('s')) {
    try { var jb = hp.get('s').replace(/-/g, '+').replace(/_/g, '/'); SP = JSON.parse(decodeURIComponent(escape(atob(jb)))); } catch (e) { SP = null; }
  }
  if (SP || hp.get('start')) {
    var state = SP ? String(SP.i || '') : (hp.get('start') || ''), gas = SP ? String(SP.g || '') : (hp.get('gas') || ''), sb = SP ? String(SP.u || '') : (hp.get('sb') || ''), ak = PUBLIC_KEY, ytWant = SP ? SP.y === 1 : hp.get('yt') === '1', mailWant = SP ? SP.m === 1 : false, provWant = SP ? String(SP.p || '') : '';
    var okState = /^[A-Za-z0-9_-]{16,64}$/.test(state);
    var okGas = /^https:\/\/script\.google\.com\/(a\/macros\/[\w.-]+|a\/[\w.-]+\/macros|macros(\/u\/\d+)?)\/s\/[\w-]+\/exec$/.test(gas);
    var okSb = /^https:\/\/[a-z0-9]+\.supabase\.co$/.test(sb);
    if (!okState || !okSb) { m.textContent = '開始情報が正しくありません。元の画面からやり直してください。'; return; }
    var verifier = randStr(48);
    crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier)).then(function (d) {
      var challenge = b64url(d);
      function go(withYt, withMail, prov) {
        if (prov === 'twitch') {   // Twitch(公開クライアント): Implicit Grant でトークンを直接受け取る
          var cid = (SP && /^[a-z0-9]{20,40}$/.test(String(SP.c || ''))) ? String(SP.c) : '7u4etnm63yightwzstz2a8gtjwdh2b';
          try { localStorage.setItem('ws_auth_pending', JSON.stringify({ state: state, gas: okGas ? gas : '', tw: 1, cid: cid, t: Date.now() })); } catch (e) {}
          m.textContent = 'Twitchのログイン画面へ移動します...(ここで止まる場合は、移動先がフィルターに止められています)';
          location.href = 'https://id.twitch.tv/oauth2/authorize?client_id=' + encodeURIComponent(cid) + '&redirect_uri=' + encodeURIComponent(location.origin + location.pathname) +
            '&response_type=token&scope=' + encodeURIComponent('user:read:email user:read:follows') + '&state=' + encodeURIComponent(state) + '&force_verify=true';
          return;
        }
        try { localStorage.setItem('ws_auth_pending', JSON.stringify({ state: state, gas: okGas ? gas : '', sb: sb, ak: ak, yt: withYt, v: verifier, t: Date.now() })); } catch (e) {}
        m.textContent = (prov === 'twitch' ? 'Twitch' : 'Google') + 'のログイン画面へ移動します...(ここで止まる場合は、移動先が会社のフィルターに止められています)';
        // PKCE: ログイン後のURLには「code」しか載らない(トークンはURLに出ない)
        location.href = sb + '/auth/v1/authorize?provider=' + (prov === 'twitch' ? 'twitch' : 'google') + (prov === 'twitch' ? '' : '&prompt=select_account') + '&code_challenge=' + encodeURIComponent(challenge) + '&code_challenge_method=s256&redirect_to=' + encodeURIComponent(location.origin + location.pathname) +
          (withYt ? '&scopes=' + encodeURIComponent('https://www.googleapis.com/auth/youtube.force-ssl' + (withMail ? ' https://www.googleapis.com/auth/gmail.modify' : '')) : '');
      }
      m.textContent = '準備ができました。進むボタンを押してください。';
      var box = document.getElementById('go'); box.style.display = 'block';
      document.getElementById('go1').onclick = function () { go(false, false); };
      document.getElementById('go2').onclick = function () { go(true, false); };
      document.getElementById('go3').onclick = function () { go(true, true); };
      document.getElementById('go4').onclick = function () { go(false, false, 'twitch'); };
      document.getElementById('go' + (provWant === 'twitch' ? '4' : mailWant ? '3' : ytWant ? '2' : '1')).style.outline = '3px solid #fff';
    });
    return;
  }

  /* ---- ② 完了モード: Supabase から戻ってきた(?code=...) ---- */
  var err = hp.get('error_description') || q.get('error_description') || '';
  var code0 = q.get('code') || '';
  var legacyTok = hp.get('access_token') || '', legacyP = hp.get('provider_token') || '';   // 旧方式(URLにトークン)も受け付ける
  history.replaceState(null, '', location.pathname);   // URLから code / トークンを消す
  var pend = null;
  try { pend = JSON.parse(localStorage.getItem('ws_auth_pending') || 'null'); localStorage.removeItem('ws_auth_pending'); } catch (e) {}
  var fresh = pend && pend.state && (Date.now() - pend.t) < 15 * 60 * 1000;

  /* Twitchから戻ってきた(#access_token=…&state=…): 保存してある state と一致したときだけ受け付ける */
  if (pend && pend.tw && fresh && legacyTok && (hp.get('state') || '') === pend.state) { twFinish(legacyTok, pend); return; }

  if (err) { m.textContent = '失敗しました: ' + err; return; }
  if (code0 && fresh && pend.v) {
    m.textContent = 'ログインを確認中...';
    fetch(pend.sb + '/auth/v1/token?grant_type=pkce', {
      method: 'POST', headers: { 'Content-Type': 'application/json', apikey: pend.ak },
      body: JSON.stringify({ auth_code: code0, code_verifier: pend.v })
    }).then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.msg || j.error_description || j.message || ('HTTP ' + r.status)); return j; }); })
      .then(function (j) { finish(j.access_token || '', j.provider_token || ''); })
      .catch(function (e) { m.textContent = '失敗しました: ' + e.message + '(元の画面からやり直してください)'; });
    return;
  }
  if (legacyTok) { finish(legacyTok, legacyP); return; }
  m.textContent = '失敗しました: 情報がありません(元の画面のリンクからログインしてください)';

  function twFinish(tok, pd) {
    if (!/^[A-Za-z0-9]{20,64}$/.test(tok)) { m.textContent = '失敗しました: Twitchのトークンの形式が正しくありません'; return; }
    m.textContent = 'Twitchのログインを確認中...';
    fetch('https://id.twitch.tv/oauth2/validate', { headers: { Authorization: 'OAuth ' + tok } })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.message || ('HTTP ' + r.status)); return j; }); })
      .then(function (v) {
        if (pd.cid && v.client_id !== pd.cid) throw new Error('別のアプリ用のトークンです');
        m.textContent = 'Twitchでログインできました(' + v.login + ')。元の画面に戻ってください。自動でログインされます。';
        if (pd.gas) { try { fetch(pd.gas, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ state: pd.state, provider: 'twitch', token: tok }) }); } catch (e) {} }
        document.getElementById('tk').value = 'twitch:' + tok; document.getElementById('fb').style.display = 'block';
      })
      .catch(function (e) { m.textContent = '失敗しました: ' + e.message + '(元の画面からやり直してください)'; });
  }

  function finish(tok, ptok) {
    if (!tok) { m.textContent = '失敗しました: トークンを取得できませんでした'; return; }
    // 予備A: 元のウィンドウへ直接渡す
    try { if (window.opener && !window.opener.closed) window.opener.postMessage({ type: 'ws-auth', access_token: tok, error: '' }, '*'); } catch (e) {}
    // 予備B: GAS のウェブアプリへ渡す
    if (fresh && pend.gas) {
      try { fetch(pend.gas, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ state: pend.state, token: tok }) }); } catch (e) {}
    }
    // メイン: 8文字コードを Supabase に登録して表示(YouTube許可のときは一時トークンも一緒に預ける)
    var A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', a = new Uint8Array(8), code = '';
    crypto.getRandomValues(a); for (var i = 0; i < 8; i++) code += A[a[i] % A.length];
    if (!(fresh && pend.sb && pend.ak)) { m.textContent = '開始情報が見つかりません。元の画面のリンクからやり直してください。'; return; }
    fetch(pend.sb + '/rest/v1/rpc/put_login_code', {
      method: 'POST', headers: { 'Content-Type': 'application/json', apikey: pend.ak, Authorization: 'Bearer ' + tok },
      body: JSON.stringify(pend.yt && ptok ? { p_code: code, p_yt: ptok } : { p_code: code })
    }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      m.textContent = (pend.yt && !ptok) ? 'ログインできましたが、YouTubeの許可が付いていません(許可画面で拒否した可能性)。次のコードで、ログインだけ完了できます。' : 'ログインできました。次のコードを、元の画面に入力してください。';
      document.getElementById('code').textContent = code;
      document.getElementById('cd').style.display = 'block';
    }).catch(function (e) {
      m.textContent = 'コードを登録できませんでした(' + e.message + ')。';
      document.getElementById('tk').value = tok; document.getElementById('fb').style.display = 'block';
    });
  }
})();
</script>
</body></html>
