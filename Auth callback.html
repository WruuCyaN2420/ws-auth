<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ログイン完了</title>
<style>body{font-family:sans-serif;background:#000;color:#fff;text-align:center;padding:28px}
textarea{width:92%;height:110px;background:#111;color:#0f0;border:1px solid #444;border-radius:8px;padding:8px;word-break:break-all}
button{background:#29b6f6;border:0;border-radius:99px;padding:10px 20px;font-weight:bold;margin:8px}</style></head>
<body>
<p id="m">ログイン処理中...</p>
<div id="fb" style="display:none">
  <p style="font-size:.85rem;opacity:.8">元の画面に自動で戻れなかった場合は、下のコードをコピーして、元の画面の「認証コードを貼り付け」に入力してください。</p>
  <textarea id="tk" readonly></textarea><br>
  <button onclick="var t=document.getElementById('tk');t.select();document.execCommand('copy');this.textContent='コピーしました'">コードをコピー</button>
</div>
<script>
(function () {
  var h = new URLSearchParams(location.hash.replace(/^#/, '')), q = new URLSearchParams(location.search);
  var err = h.get('error_description') || q.get('error_description') || '';
  var tok = h.get('access_token') || '';
  var m = document.getElementById('m');
  history.replaceState(null, '', location.pathname);   // URLからトークンを消す
  if (err || !tok) { m.textContent = '失敗しました: ' + (err || 'トークンがありません'); }
  var sent = false;
  try {
    if (window.opener && !window.opener.closed) {
      window.opener.postMessage({ type: 'ws-auth', access_token: tok, error: err }, '*');
      sent = true;
    }
  } catch (e) {}
  if (tok && sent) { m.textContent = 'ログインしました。このウィンドウは自動で閉じます。'; setTimeout(function () { window.close(); }, 1200); }
  else if (tok) {
    m.textContent = '元の画面と接続できませんでした。';
    document.getElementById('tk').value = tok; document.getElementById('fb').style.display = 'block';
  }
})();
</script>
</body></html>
